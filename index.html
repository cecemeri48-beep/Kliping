   Ditulis setelah fungsi asli; deklarasi function di bawah menimpa yang di atas. */

function _ls(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function _lset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---- Beruntun membaca (streak) ---- */
function _tglYMD(d){var p=function(n){return String(n).padStart(2,"0")};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function streakData(){var d=_ls("rcs_streak",{tgl:"",n:0,terbaik:0});return (d&&typeof d==="object")?d:{tgl:"",n:0,terbaik:0}}
function lencanaStreak(n){
  if(n>=30)return {icon:"\ud83c\udfc6",nama:"Legenda Baca"};
  if(n>=14)return {icon:"\ud83e\udd47",nama:"Konsisten"};
  if(n>=7)return {icon:"\ud83e\udd48",nama:"Rajin Baca"};
  if(n>=3)return {icon:"\ud83e\udd49",nama:"Mulai Rutin"};
  return null;
}
function streakCatat(){
  var hari=86400000,now=new Date(),hariIni=_tglYMD(now),kemarin=_tglYMD(new Date(now.getTime()-hari));
  var d=streakData(),naik=false;
  if(d.tgl===hariIni){/* sudah tercatat hari ini */}
  else if(d.tgl===kemarin){d.n=(d.n||0)+1;d.tgl=hariIni;naik=true}
  else{d.n=1;d.tgl=hariIni;naik=(d.n!==1)||!d.terbaik}
  d.terbaik=Math.max(d.terbaik||0,d.n);
  _lset("rcs_streak",d);
  if(naik){
    var t=lencanaStreak(d.n);
    setTimeout(function(){
      if(t&&(d.n===3||d.n===7||d.n===14||d.n===30))toast(t.icon+" Lencana \u201c"+t.nama+"\u201d \u2014 "+d.n+" hari beruntun membaca!");
      else if(d.n>1)toast("\ud83d\udd25 Beruntun "+d.n+" hari membaca. Lanjutkan besok!");
    },400);
  }
  return d;
}
function streakBadgeHTML(){
  var d=streakData();
  if(!d||!d.n)return "";
  var t=lencanaStreak(d.n);
  var judul="Beruntun "+d.n+" hari membaca"+(t?" \u2014 lencana "+t.nama:"")+(d.terbaik>d.n?" (rekor "+d.terbaik+" hari)":"");
  return '<span class="streak-chip" title="'+esc(judul)+'">'+(t?t.icon:"\ud83d\udd25")+'<span class="streak-n">'+d.n+' hari</span></span>';
}

/* ---- Perkiraan waktu baca ---- */
function kataKlip(k){var t=[k.judul,k.lead,k.potongan,k.konteks].concat(k.pelajaran||[]).join(" ");return (String(t).match(/\S+/g)||[]).length}
function menitBaca(k){return Math.max(1,Math.round(kataKlip(k)/190))}

/* ---- Pencarian lebih luas + sorotan kata ---- */
function _match(k){
  var q=_q();if(!q)return true;
  var t=[k.judul,k.lead,k.media,k.wilayah,k.rubrik,k.konteks,k.potongan,k.vonis,(k.topik||[]).join(" "),(k.lokasi||[]).join(" "),(k.pelajaran||[]).join(" ")].join(" ").toLowerCase();
  return q.split(/\s+/).every(function(w){return t.indexOf(w)>=0});
}
function sorot(s){var q=_q();var t=esc(s==null?"":s);if(!q)return t;try{var re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/\s+/g,"|")+")","ig");return t.replace(re,"<mark>$1</mark>")}catch(e){return t}}

/* ---- Urutan & topik ---- */
function urutkan(v){S.sort=v;render()}
function setTopik(t){S.topik=(S.topik===t?"":t);render()}
function bersihkanSaring(){S.q="";S.topik="";S.filter="Semua";render()}
function _daftarPapan(){
  var list=terbit().filter(function(k){
    return (S.filter==="Semua"||k.rubrik===S.filter)&&(!S.topik||(k.topik||[]).indexOf(S.topik)>=0)&&_match(k);
  });
  var s=S.sort||"baru";
  list.sort(function(a,b){
    if(s==="lama")return String(a.tglKliping).localeCompare(String(b.tglKliping));
    if(s==="judul")return String(a.judul).localeCompare(String(b.judul),"id");
    if(s==="singkat")return menitBaca(a)-menitBaca(b);
    return String(b.tglKliping).localeCompare(String(a.tglKliping));
  });
  return list;
}

/* ---- Kliping serupa ---- */
function serupa(k){
  return terbit().filter(function(x){return x.id!==k.id}).map(function(x){
    var s=0;if(x.rubrik===k.rubrik)s+=2;if(x.wilayah===k.wilayah)s+=1;
    (x.topik||[]).forEach(function(t){if((k.topik||[]).indexOf(t)>=0)s+=2});
    (x.materi||[]).forEach(function(m){if((k.materi||[]).indexOf(m)>=0)s+=3});
    return {k:x,s:s};
  }).filter(function(o){return o.s>0}).sort(function(a,b){return b.s-a.s}).slice(0,3).map(function(o){return o.k});
}

/* ---- Penghitung pembaca publik (Supabase, tanpa cookie) ---- */
/* Penghitung pembaca. Memakai tabel biasa (kunjungan_log), bukan fungsi RPC,
   karena endpoint /rpc/ tidak tersedia di proyek Supabase ini. Satu baris per
   sesi browser; jumlah pembaca dibaca lewat count. Gagal diam-diam bila tabel
   belum dibuat, sehingga tampilan situs tidak terganggu. */
function catatKunjunganPublik(){
  try{
    var baru = false;
    try{ baru = !sessionStorage.getItem("rcs_kunjung"); }catch(e){}
    /* Sesi baru ditandai HANYA setelah pencatatan berhasil, supaya kegagalan
       sementara di server tidak membuat kunjungan hilang tak tercatat. */
    var awal = baru
      ? Promise.resolve(supa.from("kunjungan_log").insert({})).then(function(r){
          if(!r || !r.error){ try{ sessionStorage.setItem("rcs_kunjung","1") }catch(e){} }
        })
      : Promise.resolve();
    awal.then(function(){
      return supa.from("kunjungan_log").select("*", { count: "exact", head: true });
    }).then(function(r){
      if(!r || r.error || r.count==null) return;
      window.__pembaca = r.count;
      if(typeof render==="function") render();
    }).catch(function(){});
  }catch(e){}
}

/* ---- Baris statistik ---- */
function statStrip(){
  var t=terbit();var bln=new Date().toISOString().slice(0,7);
  var ck=t.filter(function(k){return k.vonis&&k.vonis!=="Belum diverifikasi"}).length;

function kirimUsulan(){
  var elJ=document.getElementById("usJudul"),elJs=document.getElementById("usJenis"),elC=document.getElementById("usCerita"),elTg=document.getElementById("usTgl"),elL=document.getElementById("usLokasi"),elT=document.getElementById("usTautan"),elN=document.getElementById("usNama"),elK=document.getElementById("usKontak"),elI=document.getElementById("usIzin");
  var judul=elJ?elJ.value.trim():"";
  var jenis=elJs?elJs.value:"";
  var cerita=elC?elC.value.trim():"";
  var tglKejadian=elTg?elTg.value:"";
  var lokasi=elL?elL.value.trim():"";
  var tautan=elT?elT.value.trim():"";
  var namaTampilan=elN?elN.value.trim():"";
  var kontak=elK?elK.value.trim():"";
  var izinAnonim=elI?!!elI.checked:false;
  if(!judul){toast("Judul singkat belum diisi");return}
  if(!cerita){toast("Ceritanya belum diisi");return}
  var kunci="rcs_usulan_terakhir";
  try{
    var t=localStorage.getItem(kunci);
    if(t&&(Date.now()-parseInt(t,10))<24*60*60*1000){toast("Kamu sudah mengirim usulan hari ini. Coba lagi besok ya.");return}
  }catch(e){}
  var rec={judul:judul,cerita:cerita,lokasi:lokasi||null,tautan:tautan||null,kontak:kontak||null,status:"Baru",sidik:_rksSidik(),hari:new Date().toISOString().slice(0,10),jenis:jenis||null,tgl_kejadian:tglKejadian||null,nama_tampilan:namaTampilan||null,izin_anonim:izinAnonim};
  Promise.resolve(supa.from("usulan").insert(rec)).then(function(r){
    if(r&&r.error){
      var kode=(r.error.code||""),pesan=(r.error.message||"");
      if(kode==="23505"||/duplicate key/i.test(pesan)){toast("Kamu sudah mengirim usulan hari ini. Coba lagi besok ya.");try{localStorage.setItem(kunci,String(Date.now()))}catch(e){}return}
      toast("Gagal mengirim: "+pesan);return;
    }
    try{localStorage.setItem(kunci,String(Date.now()))}catch(e){}
    toast("Terima kasih! Cerita kamu sudah dikirim ke redaksi.");
    go({pv:{n:"board"}});
  }).catch(function(e){toast("Gagal mengirim: "+(e&&e.message||"tidak diketahui"))});
}

  var h=document.documentElement.scrollHeight-window.innerHeight;
  var p=h>0?Math.min(100,Math.max(0,(window.scrollY||window.pageYOffset)/h*100)):0;
  el.firstChild.style.width=p+"%";
}
function _luring(){
  var ada=document.getElementById("luring");

  else if(ada&&ada.parentNode)ada.parentNode.removeChild(ada);
}

function setStudioFmt(fmt){
  var w=document.getElementById("stWrap");if(!w)return;
  var bIg=document.getElementById("btnFmtIg"),bTt=document.getElementById("btnFmtTt");
  if(fmt==="ig"){
    w.style.width="340px";w.style.height="425px";
    if(bIg){bIg.className="btn btn-sm btn-p"}
    if(bTt){bTt.className="btn btn-sm"}
  }else{
    w.style.width="280px";w.style.height="490px";
    if(bIg){bIg.className="btn btn-sm"}
    if(bTt){bTt.className="btn btn-sm btn-p"}

}

function ubahKStudio(){
  var sel=document.getElementById("kSelTema");if(!sel)return;
  var idx=parseInt(sel.value,10)||0;
  var data=_K_TDATA[idx]||_K_TDATA[0];
  var ij=document.getElementById("kInpJudul"),is=document.getElementById("kInpSnippet"),id=document.getElementById("kInpDesc");
  if(ij)ij.value=data.t;if(is)is.value=data.s;if(id)id.value=data.d;
  updateKStudioText(data.b,data.img);
}

function updateKStudioText(badge,img){
  var ij=document.getElementById("kInpJudul"),is=document.getElementById("kInpSnippet"),id=document.getElementById("kInpDesc");
  var stTitle=document.getElementById("stTitle"),stSnippet=document.getElementById("stSnippet"),stDesc=document.getElementById("stDesc");
  var stBadge=document.getElementById("stBadge"),stWrap=document.getElementById("stWrap");
  if(ij&&stTitle)stTitle.textContent=ij.value;
  if(is&&stSnippet){
    stSnippet.innerHTML=esc(is.value)+'<div style="text-align:right;font-family:\'Plus Jakarta Sans\',sans-serif;font-size:8.5px;font-weight:800;color:#718096;margin-top:4px;letter-spacing:0.08em">KUTIPAN ARSIP · KLIPING RCS.CBS</div>';
  }
  if(id&&stDesc)stDesc.textContent=id.value;
  if(badge&&stBadge)stBadge.textContent=badge;
  if(img&&stWrap)stWrap.style.backgroundImage="linear-gradient(180deg, rgba(13,19,29,0.55) 0%, rgba(9,13,20,0.92) 100%), url('"+img+"')";
}

/* ================= sponsor, AdSense, dukungan pembaca, afiliasi ================= */
function iklanCfg(){
  var s=(typeof db!=="undefined"&&db&&db.settings)||{};
  var c=s.iklan||{};
  var d=c.dukungan||{};
  var a=c.adsense||{};
  return {
    aktif:c.aktif!==false,
    adsense:{aktif:!!a.aktif,client:a.client||"",slotRak:a.slotRak||"",slotMateri:a.slotMateri||""},
    dukungan:{
      aktif:!!d.aktif,
      judul:d.judul||"Dukung meja kliping ini",
      teks:d.teks||"Domain, server, dan kelas literasi dibiayai bersama. Dukungan sekecil apa pun membuat kliping tetap gratis dibaca.",
      tombol:d.tombol||"Kirim dukungan",
      url:d.url||""
    },
    slot:c.slot||[],
    afiliasi:c.afiliasi||[]
  };
}
function _slotHidup(sl,tempat){
  if(!sl||sl.aktif===false)return false;
  var t=sl.tempat||[];
  if(t.length&&t.indexOf(tempat)<0)return false;
  if(sl.sampai&&sl.sampai<new Date().toISOString().slice(0,10))return false;
  return !!(sl.nama||sl.teks||sl.gambar);
}
function sponsorBox(tempat){
  var c=iklanCfg();if(!c.aktif)return "";
  var list=c.slot.filter(function(s){return _slotHidup(s,tempat)}).slice(0,2);
  if(!list.length)return "";
  return '<div class="spon-wrap">'+list.map(function(s){
    var isi='<span class="spon-lbl">Sponsor</span>'+
      (isImg(s.gambar)?'<img src="'+esc(s.gambar)+'" alt="'+esc(s.nama||"Sponsor")+'" loading="lazy" />':'')+
      '<span class="spon-tx"><b>'+esc(s.nama||"")+'</b>'+(s.teks?'<small>'+esc(s.teks)+'</small>':'')+'</span>';
    return s.tautan
      ? '<a class="spon" href="'+esc(s.tautan)+'" target="_blank" rel="sponsored nofollow noopener">'+isi+'<span class="spon-go">Kunjungi \u2197</span></a>'
      : '<div class="spon">'+isi+'</div>';
  }).join("")+'</div>';
}
function adsBox(tempat){
  var a=iklanCfg().adsense;
  if(!iklanCfg().aktif||!a.aktif||!a.client)return "";
  var slot=tempat==="rak"?a.slotRak:a.slotMateri;
  if(!slot)return "";
  return '<div class="ads-wrap"><span class="spon-lbl">Iklan</span>'+
    '<ins class="adsbygoogle" style="display:block" data-ad-client="'+esc(a.client)+'" data-ad-slot="'+esc(slot)+'" data-ad-format="auto" data-full-width-responsive="true"></ins></div>';
}
function pasangIklan(){
  var a=iklanCfg().adsense;
  if(!iklanCfg().aktif||!a.aktif||!a.client)return;
  if(!document.getElementById("adsenseLib")){
    var sc=document.createElement("script");
    sc.id="adsenseLib";sc.async=true;sc.crossOrigin="anonymous";
    sc.src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client="+encodeURIComponent(a.client);
    document.head.appendChild(sc);
  }
  var ins=document.querySelectorAll("ins.adsbygoogle");
  for(var i=0;i<ins.length;i++){
    if(ins[i].getAttribute("data-dipasang"))continue;
    ins[i].setAttribute("data-dipasang","1");
    try{(window.adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}
  }
}
function dukunganBox(){
  var d=iklanCfg().dukungan;
  if(!iklanCfg().aktif||!d.aktif||!d.url)return "";
  return '<div class="dukung"><div><b>'+esc(d.judul)+'</b><p>'+esc(d.teks)+'</p></div>'+
    '<a class="btn btn-p" href="'+esc(d.url)+'" target="_blank" rel="noopener">'+esc(d.tombol)+'</a></div>';
}
function afiliasiBox(k){
  var c=iklanCfg();
  if(!c.aktif||!k||k.rubrik!=="Lemari Gear")return "";
  var list=c.afiliasi.filter(function(a){return a&&a.nama&&a.tautan});
  if(!list.length)return "";
  return '<div class="sec afl"><h4>Alat yang disebut di kliping ini</h4>'+
    '<div class="afl-list">'+list.map(function(a){
      return '<a href="'+esc(a.tautan)+'" target="_blank" rel="sponsored nofollow noopener"><b>'+esc(a.nama)+'</b>'+(a.catatan?'<small>'+esc(a.catatan)+'</small>':'')+'<span>Lihat \u2197</span></a>';
    }).join("")+'</div>'+
    '<p class="afl-note">Tautan afiliasi. Pembelian lewat tautan ini memberi komisi kecil untuk kas REICHAS tanpa menambah harga, dan tidak memengaruhi isi penilaian alat.</p></div>';
}
function _kKlip(id){return (typeof db!=="undefined"&&db&&db.kliping)?db.kliping.find(function(x){return x.id===id}):null}
function _sisipSebelumFooter(html,tambah){
  if(!tambah)return html;
  var i=html.lastIndexOf('<footer class="foot"');
  if(i<0)return html+tambah;
  var j=html.lastIndexOf("</div>",i);
  if(j<0)return html.slice(0,i)+tambah+html.slice(i);
  return html.slice(0,j)+tambah+html.slice(j);
}
(function(){
  var _rak=viewRak,_mat=viewMateri,_matD=viewMateriDetail,_clip=viewClip,_render=render;
  viewRak=function(){return _sisipSebelumFooter(_rak.apply(this,arguments),sponsorBox("rak")+adsBox("rak")+dukunganBox())};
  viewMateri=function(){return _sisipSebelumFooter(_mat.apply(this,arguments),sponsorBox("materi")+adsBox("materi")+dukunganBox())};
  viewMateriDetail=function(){return _sisipSebelumFooter(_matD.apply(this,arguments),sponsorBox("materi"))};
  viewClip=function(){return _sisipSebelumFooter(_clip.apply(this,arguments),afiliasiBox(_kKlip(S.pv&&S.pv.id)))};
  render=function(){_render.apply(this,arguments);try{pasangIklan()}catch(e){}};
})();

/* ============ tanggapan pembaca: \ud83d\udd25 api & \u2615 kopi ============ */
var RKS_EMO={api:"\ud83d\udd25",kopi:"\u2615",roket:"\ud83d\ude80",bom:"\ud83d\udca3"};
var RKS_LBL={api:"Nyalakan",kopi:"Bahan ngopi",roket:"To The Moon",bom:"Ngantuk Nih Min!"};
var RKS_KET={api:"Kliping ini penting dan mendesak dibaca",kopi:"Layak dibahas pelan-pelan sambil ngopi",roket:"Tulisan yang inspiratif",bom:"Tulisan kurang menarik"};
/* Kliping memakai \ud83d\udd25/\u2615, Buah Pikir memakai \ud83d\ude80/\ud83d\udca3 */
var RKS_SET={kliping:["api","kopi"],opini:["roket","bom"]};
function rksKunci(k){var op=false;try{op=(typeof isOpini==="function")&&isOpini(k)}catch(e){}return op?RKS_SET.opini:RKS_SET.kliping}
var RKS_HITUNG={};
var RKS_LURING=false;

function _rksSidik(){
  var s="";
  try{s=localStorage.getItem("rcs_sidik")||""}catch(e){}
  if(!s){
    s="d"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    try{localStorage.setItem("rcs_sidik",s)}catch(e){}
  }
  return s;
}
function _rksSaya(){
  try{return JSON.parse(localStorage.getItem("rcs_reaksi")||"{}")||{}}catch(e){return {}}
}
function _rksSimpanSaya(m){try{localStorage.setItem("rcs_reaksi",JSON.stringify(m))}catch(e){}}
function rksSayaPunya(id,emo){var m=_rksSaya();return !!(m[id]&&m[id][emo])}
function rksJumlah(id,emo){var h=RKS_HITUNG[id];return (h&&h[emo])||0}
function _rksUbah(id,emo,d){
  if(!RKS_HITUNG[id])RKS_HITUNG[id]={api:0,kopi:0,roket:0,bom:0};
  RKS_HITUNG[id][emo]=Math.max(0,(RKS_HITUNG[id][emo]||0)+d);
}
function muatReaksi(){
  try{
    return Promise.resolve(supa.from("reaksi").select("klip,emo")).then(function(r){
      if(r&&r.error){RKS_LURING=true;console.warn("reaksi",r.error.message);return}
      var h={};
      (r&&r.data||[]).forEach(function(x){
        if(!x||!x.klip||!RKS_EMO[x.emo])return;
        if(!h[x.klip])h[x.klip]={api:0,kopi:0,roket:0,bom:0};
        h[x.klip][x.emo]++;
      });
      RKS_HITUNG=h;RKS_LURING=false;
    }).catch(function(e){RKS_LURING=true;console.warn("reaksi",e&&e.message)});
  }catch(e){RKS_LURING=true;return Promise.resolve()}
}
function reaksiToggle(id,emo){
  if(!RKS_EMO[emo])return;
  var mine=_rksSaya(),punya=!!(mine[id]&&mine[id][emo]),sidik=_rksSidik();
  if(punya){delete mine[id][emo];if(!Object.keys(mine[id]).length)delete mine[id]}
  else{mine[id]=mine[id]||{};mine[id][emo]=1}
  _rksSimpanSaya(mine);
  _rksUbah(id,emo,punya?-1:1);
  render();
  var balik=function(pesan){
    var m=_rksSaya();

/* ============ lencana kurator & notifikasi tanggapan ============ */
function rksTotalKurator(uid){
  var out={api:0,kopi:0,total:0,klip:[]};
  if(!uid||typeof db==="undefined"||!db||!db.kliping)return out;
  db.kliping.forEach(function(k){
    if(k.kurator!==uid)return;
    var h=(typeof RKS_HITUNG!=="undefined"&&RKS_HITUNG[k.id])||{};
    /* Buah Pikir memakai kunci roket/bom, kliping memakai api/kopi */
    var x=(h.api||0)+(h.roket||0),y=(h.kopi||0)+(h.bom||0);
    out.api+=x;out.kopi+=y;
    if(x+y>0)out.klip.push({judul:k.judul,api:x,kopi:y});
  });
  out.total=out.api+out.kopi;
  out.klip.sort(function(a,b){return (b.api+b.kopi)-(a.api+a.kopi)});
  return out;
}
function lencanaTingkat(total){
  if(total>=110)return {icon:"\u2b50",n:Math.min(5,Math.floor((total-100)/10)),nama:"Bintang",basis:100};
  if(total>=60)return {icon:"\ud83e\udded",n:Math.min(5,Math.floor((total-50)/10)),nama:"Mata angin",basis:50};
  if(total>=10)return {icon:"\ud83c\udf3b",n:Math.min(5,Math.floor(total/10)),nama:"Bunga matahari",basis:0};
  return null;
}
function lencanaLanjut(total){
  var t=lencanaTingkat(total);
  if(!t)return (10-total)+" tanggapan lagi menuju \ud83c\udf3b pertama";
  if(t.n<5)return (t.basis+(t.n+1)*10-total)+" lagi menuju "+t.icon+" ke-"+(t.n+1);
  if(t.icon==="\ud83c\udf3b")return (60-total)+" lagi menuju \ud83e\udded pertama";
  if(t.icon==="\ud83e\udded")return (110-total)+" lagi menuju \u2b50 pertama";
  return "Lencana tertinggi tercapai";
}
function lencanaHTML(total){
  var t=lencanaTingkat(total);
  if(!t)return "";
  return '<span class="lcn" title="'+esc(t.nama+" \u2014 lencana kurator dari tanggapan pembaca")+'">'+t.icon.repeat(t.n)+"</span>";
}
var _rksBaruCache={};
function _rksBaru(uid,total){
  if(_rksBaruCache[uid]!==undefined)return _rksBaruCache[uid];
  var kunci="rcs_rks_lihat_"+uid,lalu=0;
  try{lalu=parseInt(localStorage.getItem(kunci)||"0",10)||0}catch(e){}
  var d=Math.max(0,total-lalu);
  _rksBaruCache[uid]=d;
  try{localStorage.setItem(kunci,String(total))}catch(e){}
  return d;
}
function kartuReaksiSaya(){
  var m=(typeof me==="function")?me():null;

    : '<p class="lcn-p">Kumpulkan '+(10-r.total)+" tanggapan lagi untuk \ud83c\udf3b pertama.</p>";

    return '<div class="lcn-r"><span class="lcn-j">'+esc(x.judul)+'</span><span class="lcn-s">\ud83d\udd25 '+x.api+" \u00b7 \u2615 "+x.kopi+"</span></div>";
  }).join("");
  return '<div class="card" style="margin-bottom:16px"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b style="font-size:14px">Tanggapan pembaca untuk klipingmu</b>'+
    (baru?'<span class="tag tag-g">+'+baru+" baru</span>":"")+"</div>"+

    "</div>";

var GERAK_OFF=false;
try{GERAK_OFF=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches}catch(e){}
var _gerakObs=null;
function _gerakSiap(){
  if(_gerakObs||GERAK_OFF||!("IntersectionObserver" in window))return _gerakObs;
  _gerakObs=new IntersectionObserver(function(en){
    for(var i=0;i<en.length;i++){
      if(!en[i].isIntersecting)continue;
      var el=en[i].target;
      el.classList.add("on");
      _gerakObs.unobserve(el);
    }
  },{rootMargin:"0px 0px -8% 0px",threshold:.04});
  return _gerakObs;
}
function pasangGerak(){
  if(GERAK_OFF)return;
  var ob=_gerakSiap();
  if(!ob)return;
  var el=document.querySelectorAll(".clip, .panel .card, .art .sec, .rks, .spon, .dukung, .pk-r");
  var n=0;
  for(var i=0;i<el.length&&i<60;i++){
    var e=el[i];
    if(e.classList.contains("muncul"))continue;
    e.classList.add("muncul");
    e.style.transitionDelay=(Math.min(n,7)*45)+"ms";
    n++;
    ob.observe(e);
  }
  setTimeout(function(){
    var s=document.querySelectorAll(".muncul:not(.on)");
    for(var j=0;j<s.length;j++)s[j].classList.add("on");
  },1400);
}
function _gerakHalaman(){
  if(GERAK_OFF)return;
  var w=document.querySelector("main")||document.querySelector(".panel")||document.querySelector(".wrap");
  if(!w)return;
  w.classList.remove("hal-masuk");
  void w.offsetWidth;
  w.classList.add("hal-masuk");
}
(function(){
  var _r=render;
  render=function(){
    var out=_r.apply(this,arguments);
    try{_gerakHalaman()}catch(e){}
    try{pasangGerak()}catch(e){}
    return out;
  };
})();

function kuisTeks(m){
  if(!m)return "";
  if(typeof m.kuis==="string"&&m.kuis.trim())return m.kuis;
  return KUIS_SEED[m.id]||"";
}
function kuisParse(teks){
  var out=[];
  String(teks||"").split(/\n+/).forEach(function(baris){
    if(!baris.trim())return;
    var ket="";var b=baris;
    var h=b.indexOf("#");
    if(h>=0&&b.lastIndexOf("|",h)>=0){ket=b.slice(h+1).trim();b=b.slice(0,b.lastIndexOf("|",h))}
    var bag=b.split("|").map(function(x){return x.trim()}).filter(function(x){return x!==""});
    if(bag.length<3)return;
    var t=bag.shift(),j=0;
    var opsi=bag.map(function(o,i){if(o.charAt(0)==="*"){j=i;return o.slice(1).trim()}return o});
    out.push({t:t,o:opsi,j:j,k:ket});
  });
  return out;
}
function kuisAda(m){return kuisParse(kuisTeks(m)).length>0}

    return '<div class="kz"><div class="kz-skor"><div class="kz-ang">'+n+"/"+t+'</div><div><b>Selesai</b><div class="kz-s">'+esc(pesan)+"</div></div></div>"+

  }

     return '<button class="'+kls+'"'+(jw===null?' onclick="kuisPilih('+i+')"':" disabled")+">"+esc(o)+"</button>";
   }).join("")+
   (jw!==null?'<div class="kz-k '+(jw===q.j?"ok":"no")+'">'+(jw===q.j?"Tepat. ":"Belum tepat. ")+esc(q.k||("Jawaban yang benar: "+q.o[q.j]+"."))+"</div>"+
     '<div class="kz-akhir"><button class="btn btn-p" onclick="kuisLanjut()">'+(st.i+1>=st.soal.length?"Lihat hasil":"Soal berikutnya")+"</button></div>":"")+
   "</div>";
}

/* ===== LAPIS 10: audit kesiapan AdSense ===== */
function _kata(s){s=String(s==null?"":s).replace(/\s+/g," ").trim();return s?s.split(" ").length:0}
function adsKataAsli(k){
  if(!k)return 0;
  var n=_kata(k.konteks)+_kata(k.vonis)+_kata(k.catatan)+_kata(k.lead);
  (k.pelajaran||[]).forEach(function(p){n+=_kata(p)});
  return n;
}
function adsKataKutip(k){return k?_kata(k.potongan):0}
function adsRasio(k){
  var a=adsKataAsli(k),q=adsKataKutip(k),t=a+q;
  return t?Math.round(q/t*100):0;
}
function adsAudit(){
  var t=(typeof terbit==="function"?terbit():[]);
  var n=t.length;
  var totalAsli=0,lemah=[],kutipTinggi=[],tanpaTaut=[],tanpaKurator=[];
  t.forEach(function(k){
    var a=adsKataAsli(k);totalAsli+=a;
    if(a<300)lemah.push({k:k,n:a});
    if(adsRasio(k)>35)kutipTinggi.push({k:k,n:adsRasio(k)});
    if(!k.tautan)tanpaTaut.push({k:k,n:0});
    if(!k.kurator)tanpaKurator.push({k:k,n:0});
  });
  var rata=n?Math.round(totalAsli/n):0;
  var mt=(db.materi||[]).length;
  var kon=hkmKontak();
  var ik=(typeof iklanCfg==="function"?iklanCfg():{});
  var pub=(ik&&ik.adsense&&ik.adsense.klien)||"";
  var poin=[
    {j:"Jumlah kliping terbit",n:n,b:n>=25,s:n+" dari 25",
     p:n>=25?"Cukup untuk dinilai sebagai situs yang hidup.":"Ini penghalang terbesar. AdSense hampir selalu menolak situs dengan sedikit halaman isi. Terbitkan sampai minimal 25 kliping sebelum mendaftar."},
    {j:"Rata-rata kata tulisan sendiri",n:rata,b:rata>=300,s:rata+" kata per kliping",
     p:rata>=300?"Panjangnya memadai untuk dianggap tulisan bernilai.":"Konteks dan pelajaran perlu lebih tebal. Di bawah 300 kata, kliping mudah dicap thin content."},
    {j:"Kliping yang tulisannya masih tipis",n:lemah.length,b:lemah.length===0,s:lemah.length+" kliping",daftar:lemah,satuan:" kata asli",
     p:"Setiap kliping sebaiknya punya minimal 300 kata konteks, pelajaran, dan vonis \u2014 di luar kutipan berita."},
    {j:"Porsi kutipan terlalu besar",n:kutipTinggi.length,b:kutipTinggi.length===0,s:kutipTinggi.length+" kliping",daftar:kutipTinggi,satuan:"% kutipan",
     p:"Kalau kutipan berita melebihi 35 persen isi halaman, Google bisa menilainya sebagai konten salinan. Perpendek potongan, perpanjang telaah."},
    {j:"Semua kliping menyebut sumber",n:tanpaTaut.length,b:tanpaTaut.length===0,s:tanpaTaut.length?tanpaTaut.length+" belum bertaut":"lengkap",daftar:tanpaTaut,
     p:"Tautan ke berita asli adalah bukti bahwa kalian mengutip, bukan mencuri."},
    {j:"Semua kliping bernama kurator",n:tanpaKurator.length,b:tanpaKurator.length===0,s:tanpaKurator.length?tanpaKurator.length+" tanpa nama":"lengkap",daftar:tanpaKurator,
     p:"Nama penulis memperkuat kredibilitas di mata peninjau dan mesin pencari."},
    {j:"Materi belajar sebagai isi asli",n:mt,b:mt>=5,s:mt+" materi",
     p:"Materi yang kalian tulis sendiri adalah bukti terkuat bahwa situs ini bukan sekadar pengumpul berita."},
    {j:"Halaman Tentang, Privasi, Kontak",b:true,s:"terpasang",
     p:"Ketiganya sudah tayang dan saling bertaut lewat footer."},
    {j:"Surel kontak yang bisa dihubungi",b:!!kon.email,s:kon.email||"belum diisi",
     p:"Peninjau AdSense kadang benar-benar mengirim surel percobaan."},
    {j:"Sitemap dan umpan RSS",b:true,s:"/sitemap.xml \u00b7 /rss.xml",
     p:"Sudah aktif. Daftarkan sitemap di Google Search Console supaya kliping cepat terindeks."},
    {j:"Berkas ads.txt",b:!!pub,s:pub?"siap dibuat":"menunggu ID penerbit",
     p:pub?"Setelah disetujui, unggah ads.txt berisi baris di bawah ke akar situs.":"Isi dulu ID penerbit AdSense di panel Sponsor & Iklan setelah pendaftaran diterima."}
  ];
  var lulus=poin.filter(function(p){return p.b}).length;
  return {poin:poin,lulus:lulus,total:poin.length,n:n,rata:rata,pub:pub};
}
function kartuKesiapan(){
  var a=adsAudit();
  var persen=Math.round(a.lulus/a.total*100);
  var warna=persen>=90?"var(--green)":persen>=60?"var(--orange)":"var(--red)";
  var rows=a.poin.map(function(p){
    var ikon=p.b?"\u2714":"\u2716";
    var d="";
    if(p.daftar&&p.daftar.length){
      d='<ul class="ads-l">'+p.daftar.slice(0,8).map(function(x){
        return "<li>"+esc(x.k.judul)+(p.satuan?' <span class="ads-a">'+x.n+esc(p.satuan)+"</span>":"")+"</li>";
      }).join("")+(p.daftar.length>8?"<li>dan "+(p.daftar.length-8)+" lainnya\u2026</li>":"")+"</ul>";
    }
    return '<div class="ads-p'+(p.b?" ok":" no")+'"><div class="ads-i">'+ikon+'</div><div><div class="ads-j">'+esc(p.j)+' <span class="ads-s">'+esc(p.s||"")+'</span></div><div class="ads-k">'+esc(p.p)+"</div>"+d+"</div></div>";
  }).join("");
  var adstxt=a.pub?'<div class="ads-code">google.com, '+esc(a.pub.replace(/^ca-/,""))+", DIRECT, f08c47fec0942fa0</div>":"";
  return '<div class="card" style="margin-top:16px"><div class="ads-h"><div><b style="font-size:15px">Kesiapan AdSense</b>'+
   '<div style="font-size:12.5px;color:var(--ink2);margin-top:3px">Dihitung ulang dari data sebenarnya setiap kali halaman ini dibuka.</div></div>'+
   '<div class="ads-skor" style="color:'+warna+'">'+a.lulus+"/"+a.total+"</div></div>"+
   '<div class="ads-bar"><i style="width:'+persen+'%;background:'+warna+'"></i></div>'+
   rows+adstxt+"</div>";
}

  if(!d.judul)e.push("Judul kliping belum diisi.");
  if(!d.lead)e.push("Ringkasan satu baris belum diisi.");
  if(!d.tautan)e.push("Tautan sumber asli wajib diisi.");
  if(!d.potongan)e.push("Bagian Potongan belum diisi.");
  if(!d.konteks)e.push("Bagian Konteks belum diisi.");
  if((d.pelajaran||[]).filter(function(x){return x}).length<3)e.push("Bagian Pelajaran harus berisi tiga poin.");
  if(!(d.materi||[]).length)e.push("Wajib menaut minimal satu halaman materi.");
  if(status==="Terbit"&&db.settings.wajibTinjauan&&(db.sensitif||[]).indexOf(d.rubrik)>=0&&!d.peninjau)
    e.push("Rubrik sensitif wajib punya peninjau sebelum terbit.");
  if(status==="Terbit"&&mutuTegas()){
    var A=mutuAmbang(),o=mutuObj(d),a=adsKataAsli(o),r=adsRasio(o);

}

function slugBersih(t){
  var s=String(t||"").toLowerCase();
  try{s=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"")}catch(e){}
  s=s.replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  return s;
}
function slugDariJudul(j){
  var dasar=slugBersih(j);
  if(!dasar)return "";
  var kata=dasar.split("-").filter(function(w){return w&&!SLUG_BUANG[w]});
  if(!kata.length)kata=dasar.split("-").filter(Boolean);
  var out=[],n=0;
  for(var i=0;i<kata.length&&out.length<7;i++){
    if(n+kata[i].length+1>62)break;
    out.push(kata[i]);n+=kata[i].length+1;
  }
  return out.join("-");
}
function slugUnik(dasar){
  var s=slugBersih(dasar)||("kliping-"+new Date().toISOString().slice(0,10));
  var ada={};
  try{(db.kliping||[]).forEach(function(k){ada[k.id]=1})}catch(e){}
  if(!ada[s])return s;
  for(var i=2;i<200;i++){if(!ada[s+"-"+i])return s+"-"+i}
  return s+"-"+Date.now();
}

function cetakEsc(s){return esc(String(s==null?"":s))}

function jilidNama(j){
  var B=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  var p=String(j||"").split("-");
  if(p.length<2)return String(j||"");
  var i=parseInt(p[1],10)-1;
  return (B[i]||p[1])+" "+p[0];
}

function jilidKlip(j){
  return terbit().filter(function(k){return jilid(k.tglKliping)===j})
    .sort(function(a,b){return String(a.tglKliping).localeCompare(String(b.tglKliping))});
}

function cetakKlipHTML(k,no){
  var rj=(k.materi||[]).map(function(id){var m=mat(id);return m?"<li>"+cetakEsc(m.judul)+" \u00b7 "+cetakEsc(m.rumpun)+"</li>":""}).join("");
  var pel=(k.pelajaran||[]).filter(function(p){return p&&String(p).trim()});
  var h='<article class="klp">';
  h+='<div class="tags">'+no+' \u00b7 '+cetakEsc(k.rubrik)+' \u00b7 '+cetakEsc(k.wilayah)+'</div>';
  h+='<h2>'+cetakEsc(k.judul)+'</h2>';
  if(k.lead)h+='<p class="lead">'+cetakEsc(k.lead)+'</p>';
  if(isImg(k.gambar)){
    h+='<div class="sec"><img class="gbr" src="'+cetakEsc(k.gambar)+'" alt="" />';
    if(k.gbrKet)h+='<p class="ket">'+cetakEsc(k.gbrKet)+'</p>';
    h+='</div>';
  }
  h+='<div class="sec"><h4>1 \u00b7 Potongan</h4><div class="cut">'+cetakEsc(k.potongan)+'</div>'+
     '<div class="src">'+cetakEsc(k.media)+' \u00b7 '+cetakEsc(tglID(k.tglBerita))+(k.tautan?' \u00b7 '+cetakEsc(k.tautan):'')+'</div></div>';
  if(k.konteks)h+='<div class="sec"><h4>2 \u00b7 Konteks</h4><p>'+cetakEsc(k.konteks)+'</p></div>';
  if(pel.length)h+='<div class="sec"><h4>3 \u00b7 Pelajaran</h4><ol>'+pel.map(function(p){return "<li>"+cetakEsc(p)+"</li>"}).join("")+'</ol></div>';
  h+='<div class="sec"><h4>4 \u00b7 Rujukan materi</h4><ul>'+(rj||"<li>\u2014</li>")+'</ul></div>';
  h+='<div class="by">Digunting '+cetakEsc(tglID(k.tglKliping))+' oleh '+cetakEsc(nm(k.kurator))+
     (k.peninjau?' \u00b7 ditinjau '+cetakEsc(nm(k.peninjau)):'')+
     ' \u00b7 kliping-reichas.my.id/klip/'+cetakEsc(k.id)+'</div>';
  h+='</article>';
  return h;
}

function cetakDokumen(judul,subjudul,daftar){
  var tglCetak=new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
  var h='<!doctype html><html lang="id"><head><meta charset="utf-8" /><title>'+cetakEsc(judul)+'</title>'+CETAK_CSS+'</head><body>';
  h+='<div class="noprint"><span>Pilih tujuan <b>Simpan sebagai PDF</b> pada jendela cetak.</span><button onclick="window.print()">Cetak / Simpan PDF</button></div>';
  h+='<header class="jk"><h1>'+cetakEsc(judul)+'</h1><div class="sub">Kliping RCS.CBS \u00b7 Baca. Pahami. Bagikan.</div>'+
     '<div class="met">'+cetakEsc(subjudul)+' \u00b7 dicetak '+cetakEsc(tglCetak)+'</div></header>';
  h+='<div class="isi"><h3>Daftar isi</h3><ol>'+daftar.map(function(k){return "<li>"+cetakEsc(k.judul)+" \u2014 "+cetakEsc(k.rubrik)+"</li>"}).join("")+'</ol></div>';
  h+=daftar.map(function(k,i){return cetakKlipHTML(k,i+1)}).join("");
  h+='<div class="ft">Kliping RCS.CBS \u00b7 Dikelola Divisi Komunikasi &amp; Publikasi bersama Divisi Pendidikan &amp; Edukasi \u00b7 REICHAS CHELEBES, Makassar<br />'+
     'Arsip daring: kliping-reichas.my.id \u00b7 Surel redaksi: kliping.rcscbs@gmail.com</div>';
  h+='</body></html>';
  return h;
}

function cetakBuka(html,namaBerkas){
  try{
    var w=window.open("","_blank");
    if(w&&w.document){
      w.document.open();w.document.write(html);w.document.close();
      try{w.document.title=namaBerkas}catch(e){}
      setTimeout(function(){try{w.focus();w.print()}catch(e){}},700);
      return true;
    }
  }catch(e){}
  try{
    var lama=document.getElementById("cetakFrame");
    if(lama)lama.parentNode.removeChild(lama);
    var f=document.createElement("iframe");
    f.id="cetakFrame";
    f.style.cssText="position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0";
    document.body.appendChild(f);
    var d=f.contentWindow.document;
    d.open();d.write(html);d.close();
    setTimeout(function(){try{f.contentWindow.focus();f.contentWindow.print()}catch(e){}},900);
    return true;
  }catch(e){}
  return false;
}

function cetakJilid(j){
  var kl=jilidKlip(j);
  if(!kl.length){toast("Jilid ini belum berisi kliping terbit");return}
  var nama="Jilid "+jilidNama(j);
  var ok=cetakBuka(cetakDokumen(nama,kl.length+" potongan",kl),"Kliping RCS.CBS \u2014 "+nama);
  toast(ok?"Menyiapkan "+nama+" \u2014 pilih Simpan sebagai PDF":"Peramban menolak membuka jendela cetak");
}

function cetakSemua(){
  var kl=terbit().slice().sort(function(a,b){return String(b.tglKliping).localeCompare(String(a.tglKliping))});
  if(!kl.length){toast("Belum ada kliping terbit");return}
  var ok=cetakBuka(cetakDokumen("Arsip Lengkap",kl.length+" potongan dari "+new Set(kl.map(function(k){return jilid(k.tglKliping)})).size+" jilid",kl),"Kliping RCS.CBS \u2014 Arsip Lengkap");
  toast(ok?"Menyiapkan arsip lengkap \u2014 pilih Simpan sebagai PDF":"Peramban menolak membuka jendela cetak");
}

    try {
      var canvas = document.getElementById("mascotCanvas");
      var fallback = document.getElementById("mascotFallbackImg");
      if (!canvas || !fallback) return;

      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);

      var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var data = imgData.data;

      for (var i = 0; i < data.length; i += 4) {
        var r = data[i], g = data[i+1], b = data[i+2];
        if (r >= 230 && g >= 230 && b >= 230) {
          data[i+3] = 0;
        }
      }

      ctx.putImageData(imgData, 0, 0);
      fallback.style.display = "none";
      canvas.style.display = "block";
    } catch(e) {
      console.warn("Mascot canvas processing fallback:", e);
    }
  };
  img.src = mascotSrc;

  var quoteIdx = 0;
  var bubbleTimer = null;

  window.showMascotQuote = function(text) {
    var b = document.getElementById("mascotBubble");
    var t = document.getElementById("mascotText");
    if (!b || !t) return;
    t.innerHTML = text || quotes[quoteIdx];
    b.classList.add("show");
    
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function() {
      b.classList.remove("show");
    }, 7000);
  };

  window.closeMascotBubble = function() {
    var b = document.getElementById("mascotBubble");
    if (b) b.classList.remove("show");
    clearTimeout(bubbleTimer);
  };

  window.onMascotClick = function() {
    var avatar = document.getElementById("mascotAvatarWrap");
    if (avatar) {
      avatar.classList.remove("mascot-bounce");
      void avatar.offsetWidth;
      avatar.classList.add("mascot-bounce");
    }
    quoteIdx = (quoteIdx + 1) % quotes.length;
    showMascotQuote(quotes[quoteIdx]);
  };

  window.restoreMascot = function() {
    widget.classList.remove("minimized");
    showMascotQuote("Halo lagi! Senang kamu kembali membaca. 🦬");
  };

  setTimeout(function() {
    showMascotQuote(quotes[0]);
  }, 2200);

  setInterval(function() {
    if (!widget.classList.contains("minimized")) {
      quoteIdx = (quoteIdx + 1) % quotes.length;
      showMascotQuote(quotes[quoteIdx]);
    }
  }, 25000);
})();

bootstrap();
</script>
</body>
</html>
