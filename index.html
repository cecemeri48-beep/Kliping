<style>
:root{
  --ink:#2C2C2B; --ink2:#7D7A75; --canvas:#FFFFFF; --soft:#F9F8F7; --soft2:#F0EFED;
  --line:#E6E5E3; --blue:#2783DE; --blue-s:#E5F2FC; --green:#46A171; --green-s:#E8F1EC;
  --orange:#D5803B; --orange-s:#FBEBDE; --red:#E56458; --red-s:#FCE9E7;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);font-size:16px;line-height:1.5;color:var(--ink);background:var(--soft)}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;font-size:14px;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:8px;min-height:40px}
.btn:hover{background:var(--soft2)}
.btn-p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-p:hover{background:#1f6fbd}
.btn-g{background:var(--green);border-color:var(--green);color:#fff}
.btn-g:hover{background:#3b8b60}
.btn-d{background:#fff;border-color:#e4b8b3;color:#b5443a}
.btn-d:hover{background:var(--red-s)}
.btn-sm{padding:6px 10px;min-height:34px;font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.02em;padding:3px 8px;border-radius:6px;background:var(--soft2);color:var(--ink2)}
.tag-b{background:var(--blue-s);color:#1a5f9e}
.tag-g{background:var(--green-s);color:#2f7050}
.tag-o{background:var(--orange-s);color:#96541f}
.tag-r{background:var(--red-s);color:#b5443a}
.mono{font-family:Menlo,Consolas,monospace;font-size:12px}

/* ---------- header ---------- */
.top{background:#fff;border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding:14px 24px;max-width:1120px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:44px;height:44px;flex:none;background:none;border-radius:50%}
.brand h1{margin:0;font-size:17px;letter-spacing:.06em;line-height:1.2}
.brand p{margin:2px 0 0;font-size:12px;color:var(--ink2);font-family:var(--serif);font-style:italic}
.nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.nav button{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--ink2);min-height:40px}
.nav button:hover{background:var(--soft2);color:var(--ink)}
.nav button.on{background:var(--soft2);color:var(--ink);font-weight:600}
.who{display:flex;align-items:center;gap:8px;padding-left:14px;margin-left:6px;border-left:1px solid var(--line)}
.avat{width:30px;height:30px;border-radius:50%;background:var(--blue-s);color:#1a5f9e;font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.who small{display:block;color:var(--ink2);font-size:11px;line-height:1.2}
.who b{font-size:13px;line-height:1.2;display:block}

/* ---------- public board ---------- */
.hero{background:#fff;border-bottom:1px solid var(--line);padding:34px 0 28px}
.hero h2{margin:0 0 8px;font-size:32px;line-height:1.15;letter-spacing:-.01em}
.hero p{margin:0;color:var(--ink2);max-width:680px}
.ticker{margin-top:20px;border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:10px 14px;font-size:13px;color:var(--ink2);display:flex;gap:20px;overflow-x:auto;white-space:nowrap}
.ticker b{color:var(--ink)}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:20px 0 4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;color:var(--ink2);min-height:36px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.board{columns:3;column-gap:20px;padding:16px 0 48px}
.clip{break-inside:avoid;background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:20px;position:relative}
.clip:before{content:"";position:absolute;left:16px;right:16px;top:0;height:3px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 11px)}
.clip h3{margin:10px 0 6px;font-size:17px;line-height:1.3}
.clip .lead{margin:0;color:var(--ink2);font-size:14px}
.src{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-family:var(--serif);font-size:12px;color:var(--ink2);display:flex;justify-content:space-between;gap:10px}
.clip button.open{margin-top:12px;width:100%}

/* ---------- article ---------- */
.art{max-width:760px;margin:0 auto;padding:28px 24px 64px}
.art h2{font-size:28px;line-height:1.2;margin:12px 0 8px}
.art .lead{font-size:17px;color:var(--ink2);margin:0 0 20px}
.sec{border:1px solid var(--line);background:#fff;border-radius:8px;padding:18px;margin-bottom:16px}
.sec h4{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.sec p{margin:0 0 10px}
.sec p:last-child{margin-bottom:0}
.cut{font-family:var(--serif);font-size:16px;line-height:1.6;border-left:3px solid var(--line);padding-left:14px;color:#4a4845}
.sec ol{margin:0;padding-left:20px}
.sec ol li{margin-bottom:8px}
.note{background:var(--blue-s);border:1px solid #cfe6f8;border-radius:8px;padding:12px 14px;font-size:14px;color:#1a5f9e}
.note.g{background:var(--green-s);border-color:#cfe4d8;color:#2f7050}
.note.o{background:var(--orange-s);border-color:#f0d7bd;color:#96541f}
.note.r{background:var(--red-s);border-color:#f3cfcb;color:#b5443a}

/* ---------- generic grid/cards ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}
.stat b{display:block;font-size:28px;line-height:1.1;letter-spacing:-.01em}
.stat span{font-size:13px;color:var(--ink2)}
.bar{height:8px;border-radius:99px;background:var(--soft2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--blue)}

/* ---------- admin ---------- */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 73px)}
.side{background:#fff;border-right:1px solid var(--line);padding:20px 12px}
.side .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);padding:12px 10px 6px}
.side button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;color:var(--ink2);min-height:40px}
.side button:hover{background:var(--soft)}
.side button.on{background:var(--blue-s);color:#1a5f9e;font-weight:600}
.side i.ic{font-style:normal;width:18px;text-align:center;flex:none}
.panel{padding:26px 28px 64px;max-width:960px}
.ph{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ph h2{margin:0;font-size:24px;letter-spacing:-.01em}
.ph p{margin:4px 0 0;color:var(--ink2);font-size:14px}
.ph .act{margin-left:auto;display:flex;gap:8px}
table{width:100%;border-collapse:collapse;background:#fff;font-size:14px}
.tbl{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tbl-scroll{overflow-x:auto}
th{text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);padding:10px 14px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.f{margin-bottom:16px}
.f label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.f .hint{font-weight:400;color:var(--ink2)}
.f input[type=text],.f input[type=url],.f input[type=date],.f select,.f textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.f textarea{min-height:88px;resize:vertical;line-height:1.5}
.req:after{content:" *";color:var(--red)}
.checks{display:grid;gap:8px}
.checks label{display:flex;gap:9px;align-items:flex-start;font-weight:400;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff}
.checks input{margin-top:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sticky{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}

/* ---------- login ---------- */
.login{max-width:520px;margin:56px auto;padding:0 24px}
.role{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:14px;margin-bottom:10px;min-height:44px}
.role:hover{border-color:var(--blue);background:var(--blue-s)}
.role b{display:block;font-size:15px}
.role span{font-size:13px;color:var(--ink2)}
.role i.ic{font-style:normal;font-size:20px;width:26px;text-align:center;flex:none}

/* ---------- misc ---------- */
.foot{border-top:1px solid var(--line);background:#fff;padding:26px 0;font-size:13px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font-size:14px;z-index:60;box-shadow:0 4px 12px rgba(0,0,0,.14)}
.empty{text-align:center;color:var(--ink2);padding:40px 20px;font-size:14px}
body.thin .clip:before,body.thin .brand img,body.thin .ticker{display:none}
body.thin .hero{padding:20px 0 16px}

@media (max-width:900px){
  .board{columns:2}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}
  .shell{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:10px 16px}
  .side .lbl{display:none}.side button{width:auto;white-space:nowrap}
  .panel{padding:20px 16px 56px}
}
@media (max-width:640px){
  .wrap,.top-in{padding-left:16px;padding-right:16px}
  .board{columns:1}.g2,.g4,.row2{grid-template-columns:1fr}
  .hero h2{font-size:25px}.nav{width:100%;margin-left:0}
  .top-in{flex-wrap:wrap}.who{margin-left:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.top-in{max-width:1220px;padding-top:12px;padding-bottom:12px}
.brand img{width:48px;height:48px;padding:0;background:none;box-shadow:none;filter:drop-shadow(0 3px 5px rgba(16,42,67,.3))}
.brand h1{font-size:18px;color:var(--navy);letter-spacing:.08em}.brand p{font-family:var(--sans);font-style:normal;font-weight:600;color:#6c6d76}
.nav button{font-weight:700;color:#536275}.nav button:hover,.nav button.on{background:#ecf7e2;color:var(--navy)}
.btn-p{background:linear-gradient(135deg,var(--violet),#4267e7);border:0;box-shadow:0 5px 12px rgba(91,69,232,.24)}
.hero{position:relative;isolation:isolate;min-height:450px;padding:0;border:0;display:flex;align-items:end;background:#102a43 center/cover no-repeat}
.hero:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(9,22,35,.9) 0%,rgba(9,22,35,.68) 44%,rgba(9,22,35,.12) 100%)}
.hero:after{content:"";position:absolute;inset:auto 0 0;height:128px;background:linear-gradient(transparent,#f6f3ed);z-index:-1}
.hero .wrap{width:100%;padding-top:62px;padding-bottom:76px}.hero h2{max-width:700px;color:#fff;font-size:clamp(36px,5vw,62px);letter-spacing:-.045em;line-height:1.03;text-wrap:balance;margin-bottom:18px}.hero p{font-size:18px;line-height:1.55;max-width:610px;color:rgba(255,255,255,.86)}
.hero-kicker{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 12px;background:rgba(183,234,94,.95);color:#193234;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;margin-bottom:18px}.hero-kicker i{width:8px;height:8px;border-radius:50%;background:var(--coral);display:block}
.ticker{border:0;border-radius:16px;background:rgba(255,255,255,.93);box-shadow:0 12px 28px rgba(7,20,29,.18);padding:12px 16px;gap:20px;color:#536275}.ticker b{color:var(--navy)}
.filters{position:relative;z-index:2;padding:0 0 18px;margin-top:-26px}.chip{border:0;box-shadow:0 2px 0 rgba(16,42,67,.08);font-weight:700;color:#536275}.chip:hover{transform:translateY(-2px);color:var(--violet)}.chip.on{background:var(--navy);color:#fff}
.board{column-gap:22px;padding-top:0}.clip{border:0;border-radius:18px;box-shadow:0 12px 30px rgba(16,42,67,.11);padding:20px 18px 18px;overflow:hidden;transition:transform .2s ease,box-shadow .2s ease}.clip:hover{transform:translateY(-5px) rotate(-.35deg);box-shadow:0 18px 36px rgba(16,42,67,.17)}.clip:before{height:7px;left:0;right:0;background:linear-gradient(90deg,var(--coral),var(--sun),var(--lime),var(--aqua),var(--violet))}.clip:nth-child(3n+2):before{background:linear-gradient(90deg,var(--aqua),var(--violet),var(--coral))}.clip:nth-child(3n):before{background:linear-gradient(90deg,var(--sun),var(--coral),var(--violet))}.clip h3{font-size:18px;color:var(--navy);margin-top:15px}.tag{border-radius:999px}.tag-b{background:#dff4ff;color:#126aa5}.open{border:0!important;background:#f2efff!important;color:#4f3bb4!important;font-weight:800!important}.open:hover{background:#e6e1ff!important}
.foot{position:relative;overflow:hidden;border:0;background:#102a43;color:#eaf1f7;padding:48px 0}.foot:before{content:"";position:absolute;inset:0;background:var(--paper) center/cover no-repeat;opacity:.14;mix-blend-mode:screen}.foot .wrap{position:relative}.foot b{font-size:19px;letter-spacing:.04em;color:#fff}.foot-marks{display:flex;gap:9px;margin:14px 0}.foot-marks i{display:block;width:34px;height:7px;border-radius:8px;background:var(--coral)}.foot-marks i:nth-child(2){background:var(--sun)}.foot-marks i:nth-child(3){background:var(--lime)}.foot .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.26);color:#fff}.foot .btn:hover{background:rgba(255,255,255,.16)}
@media(max-width:640px){.hero{min-height:500px;background-position:60% center}.hero .wrap{padding-top:46px;padding-bottom:68px}.hero h2{font-size:40px}.hero p{font-size:16px}.ticker{margin-top:18px}.top-in{gap:10px}.brand h1{font-size:15px}.brand p{font-size:10px}.nav{order:3;width:100%;overflow:auto;flex-wrap:nowrap}.nav button{white-space:nowrap}.who{padding-left:8px}.who .btn{padding:7px 9px}.who b,.who small{display:none}}


/* Newspaper-cutout artwork selected as public header */
.paper-hero{min-height:0;height:clamp(230px,42vw,520px);display:block;background-position:center;background-size:cover}.paper-hero:before,.paper-hero:after{display:none}.hero-stats{position:relative;z-index:2;margin-top:-22px;margin-bottom:0}.paper-hero+.wrap .filters{margin-top:0;padding-top:20px}@media(max-width:640px){.paper-hero{height:205px;background-position:center}.hero-stats{margin-top:-12px;border-radius:12px;font-size:12px}}

/* Header artwork shown unfiltered; site metrics sit below it */
.paper-hero:before,.paper-hero:after{display:none!important;content:none!important}.hero-stats{margin-top:16px!important;margin-bottom:0!important;box-shadow:0 8px 22px rgba(16,42,67,.12)}@media(max-width:640px){.hero-stats{margin-top:12px!important}}

/* Editorial copy in the clipping header */
.paper-hero{position:relative;align-items:stretch}.paper-copy{display:flex;align-items:flex-end;width:100%;padding-top:30px;padding-bottom:30px;pointer-events:none}.paper-copy>div{max-width:610px;background:rgba(10,28,38,.82);backdrop-filter:blur(8px);border-left:6px solid var(--lime);border-radius:0 18px 18px 0;padding:18px 22px;box-shadow:0 14px 28px rgba(0,0,0,.18)}.paper-copy h2{margin:0 0 7px;color:#fff;font-size:clamp(22px,2.5vw,35px);line-height:1.12;letter-spacing:-.025em}.paper-copy p{margin:0;color:rgba(255,255,255,.88);font-size:15px;line-height:1.5;max-width:550px}@media(max-width:640px){.paper-copy{padding:18px 16px}.paper-copy>div{padding:12px 14px;border-left-width:4px;border-radius:0 12px 12px 0}.paper-copy h2{font-size:21px}.paper-copy p{font-size:12px;line-height:1.4}}

/* Keep rubrik filters clean and independent from the header metrics */
.hero-stats{display:none!important}.paper-hero+.wrap .filters{display:flex;align-items:center;gap:10px;margin:0;padding:28px 0 22px}.paper-hero+.wrap .chip{margin:0;white-space:nowrap;min-height:40px;padding:8px 15px;border:1px solid rgba(16,42,67,.10);background:#fff;box-shadow:0 3px 0 rgba(16,42,67,.10)}.paper-hero+.wrap .chip.on{background:var(--navy);border-color:var(--navy);box-shadow:0 4px 0 #8ba9b9}@media(max-width:640px){.paper-hero+.wrap .filters{gap:8px;padding:20px 0 16px}.paper-hero+.wrap .chip{min-height:36px;padding:6px 11px;font-size:12px}}

/* Cinematic, hyper-real header motion — deliberately subtle */
.paper-hero{overflow:hidden;animation:paperDrift 18s ease-in-out infinite alternate;background-size:108% auto!important;background-position:50% 48%}.paper-copy{animation:copyReveal .9s cubic-bezier(.2,.8,.2,1) both}.paper-copy>div{position:relative;overflow:hidden}.paper-copy>div:after{content:"";position:absolute;inset:-70% -30%;pointer-events:none;background:linear-gradient(110deg,transparent 36%,rgba(255,255,255,.22) 49%,transparent 62%);transform:translateX(-80%) rotate(5deg);animation:paperSheen 8s ease-in-out 1.3s infinite}.paper-copy h2,.paper-copy p{position:relative;z-index:1;text-shadow:0 3px 18px rgba(0,0,0,.28)}@keyframes paperDrift{0%{background-position:47% 45%}100%{background-position:54% 54%}}@keyframes copyReveal{from{opacity:0;transform:translateY(20px);filter:blur(4px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}@keyframes paperSheen{0%,72%,100%{transform:translateX(-85%) rotate(5deg)}88%{transform:translateX(85%) rotate(5deg)}}@media(max-width:640px){.paper-hero{background-size:150% auto!important;background-position:52% 45%}.paper-copy h2{text-wrap:balance}}@media(prefers-reduced-motion:reduce){.paper-hero,.paper-copy,.paper-copy>div:after{animation:none!important}}

/* ================= UI/UX polish pass ================= */
/* Smoother, cohesive interactions across the whole app */
.btn{transition:transform .15s ease,box-shadow .15s ease,background .15s ease,border-color .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-p:hover{box-shadow:0 8px 18px rgba(91,69,232,.30)}
.btn-g:hover{box-shadow:0 8px 18px rgba(70,161,113,.28)}

/* Fix: first clipping-card accent bar used a malformed gradient (missing paren) */
.clip:before{background:linear-gradient(90deg,var(--coral),var(--sun),var(--lime),var(--aqua),var(--violet))}

/* Public cards: clearer title/lead rhythm + tidy source line */
.clip .lead{line-height:1.5;color:#5b5a57}
.clip .src{border-top:1px solid rgba(16,42,67,.09)}

/* --- Admin shell: bring it in line with the colourful public side --- */
.shell{background:#f6f3ed}
.side{background:rgba(255,255,255,.96);border-right:1px solid rgba(16,42,67,.08)}
.side button{transition:background .15s ease,color .15s ease}
.side button:hover{background:#ecf7e2;color:var(--navy)}
.side button.on{background:linear-gradient(135deg,rgba(115,87,255,.15),rgba(66,103,231,.10));color:#4f3bb4}
.side button.on i.ic{color:var(--violet)}
/* --- Menu admin mobile: satu tombol --- */
.smenu{display:none}
@media (max-width:900px){
  .side{display:none!important}
  .smenu{display:block;position:relative;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;z-index:40}
  .smenu-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;color:var(--ink);min-height:44px}
  .smenu-caret{color:var(--ink2)}
  .smenu-pop{display:none;position:absolute;left:16px;right:16px;top:calc(100% - 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 34px rgba(16,42,67,.16);padding:6px;max-height:70vh;overflow-y:auto}
  .smenu.open .smenu-pop{display:block}
  .smi{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:8px;color:var(--ink2);min-height:44px;font-size:15px}
  .smi:hover{background:var(--soft)}
  .smi.on{background:var(--blue-s);color:#1a5f9e;font-weight:600}
  .smi i.ic{font-style:normal;width:18px;text-align:center;flex:none}
}
[data-tema="gelap"] .smenu{background:#12161d;border-bottom-color:#2b313b}
[data-tema="gelap"] .smenu-btn{background:#1b212b;color:var(--ink);border-color:var(--line)}
[data-tema="gelap"] .smenu-pop{background:#161b24;border-color:#2b313b}
[data-tema="gelap"] .smi{color:#c7ccd4}
[data-tema="gelap"] .smi:hover{background:#22303f;color:#eef3f8}
[data-tema="gelap"] .smi.on{background:linear-gradient(135deg,rgba(115,87,255,.30),rgba(66,103,231,.22));color:#c3b7ff}
.grp-lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:20px 0 8px;font-weight:700}
.grp-lbl:first-of-type{margin-top:6px}
.grp-n{display:inline-block;background:var(--soft2);border-radius:999px;padding:2px 9px;font-size:11px;letter-spacing:0;text-transform:none;color:var(--ink)}
[data-tema="gelap"] .grp-lbl{color:#8b9099}
[data-tema="gelap"] .grp-n{background:#22303f;color:#eef3f8}
.ph h2{color:var(--navy)}

/* Admin cards + tables: softer, floaty, rounded to match the public cards */
.panel .card{border:0;border-radius:16px;box-shadow:0 8px 22px rgba(16,42,67,.08)}
.panel .tbl{border:0;border-radius:16px;box-shadow:0 8px 22px rgba(16,42,67,.08);overflow:hidden}
.panel .tbl-scroll{overflow:visible;overflow-x:auto}
.ph .act{flex:none}
@media(max-width:640px){.panel{overflow-x:hidden}.panel .tbl-scroll table{min-width:600px}.ph .act{width:100%;margin-left:0}.ph .act .btn{width:100%;justify-content:center}}
.panel .note{border-radius:14px}
.panel .sticky{border:0;border-radius:16px;box-shadow:0 8px 22px rgba(16,42,67,.08)}

/* Dashboard stat cards: cycling colour accent + navy figures */
.stat{position:relative;overflow:hidden}
.stat b{color:var(--navy)}
.stat:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--violet)}
.grid.g4 .stat:nth-child(1):before{background:var(--coral)}
.grid.g4 .stat:nth-child(2):before{background:var(--sun)}
.grid.g4 .stat:nth-child(3):before{background:var(--aqua)}
.grid.g4 .stat:nth-child(4):before{background:var(--violet)}

/* Default progress bars adopt the brand gradient (inline status colours still win) */
.bar i{background:linear-gradient(90deg,var(--violet),var(--aqua))}

/* --- Login: warmer, more inviting --- */
.login{max-width:560px}
.login h2{color:var(--navy)}
.role{border:0;border-radius:16px;box-shadow:0 6px 18px rgba(16,42,67,.08);transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
.role:hover{transform:translateY(-3px);background:#fff;box-shadow:0 14px 30px rgba(16,42,67,.15)}
.role i.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--violet),#4267e7);color:#fff;font-size:18px}

/* Inputs: friendlier focus ring */
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(115,87,255,.14);outline:none}

/* Chips: gentle press feedback */
.chip{transition:transform .15s ease,box-shadow .15s ease,color .15s ease}

/* Toast: match rounded, floaty language */
.toast{border-radius:12px;box-shadow:0 10px 26px rgba(7,20,29,.28)}

@media(prefers-reduced-motion:reduce){.btn,.role,.chip,.side button,.clip{transition:none!important}}

/* Modals for admin add/edit */
.modal-bg{position:fixed;inset:0;background:rgba(16,42,67,.46);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 40px;overflow:auto}
.modal{background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(7,20,29,.34);width:100%;max-width:560px;padding:22px 22px 18px;animation:modalPop .22s cubic-bezier(.2,.8,.2,1) both}
.modal h3{margin:0 0 4px;font-size:19px;color:var(--navy);letter-spacing:-.01em}
.modal .msub{margin:0 0 18px;color:var(--ink2);font-size:14px;line-height:1.45}
.modal .end{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
@keyframes modalPop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.modal{animation:none!important}}
@media(max-width:640px){.modal-bg{padding:16px 10px 30px}}
.lit-banner{padding:0 24px}
.lit-inner{max-width:1120px;margin:22px auto 0;background:linear-gradient(120deg,#7357ff,#2783DE 55%,#31c5c2);border-radius:20px;padding:30px 34px;color:#fff;box-shadow:0 14px 40px rgba(39,131,222,.28);position:relative;overflow:hidden}
.lit-inner:before{content:"";position:absolute;right:-40px;top:-40px;width:190px;height:190px;background:radial-gradient(circle,rgba(183,234,94,.55),transparent 70%);pointer-events:none}
.lit-badge{display:inline-block;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600}
.lit-inner h2{margin:14px 0 8px;font-size:30px;line-height:1.1;color:#fff}
.lit-inner p{margin:0;max-width:640px;font-size:15px;line-height:1.5;color:rgba(255,255,255,.92)}
.lit-share{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px;position:relative}
.lit-share>span{font-size:13px;font-weight:600;color:rgba(255,255,255,.85)}
.tts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 2px}.tts-hint{font-size:12px;color:var(--ink2)}.tts-sel{font-size:12px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);max-width:220px}.clip-share{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px dashed var(--line)}
.clip-share>span{font-size:13px;font-weight:600;color:var(--ink2)}
.sh{border:0;cursor:pointer;color:#fff;font-weight:600;font-size:13px;padding:9px 15px;border-radius:10px;transition:transform .08s,filter .15s;display:inline-flex;align-items:center;gap:6px}
.sh:hover{filter:brightness(1.08);transform:translateY(-1px)}
.sh:active{transform:translateY(0)}
.sh-wa{background:#25D366}
.sh-fb{background:#1877F2}
.sh-x{background:#000}
.sh-tt{background:#000;background-image:linear-gradient(135deg,#25F4EE 0%,#050505 42%,#FE2C55 100%)}
@media(max-width:640px){.lit-inner{padding:24px}.lit-inner h2{font-size:24px}}

/* ================= Mobile-first refresh (kekinian) ================= */
@media(max-width:720px){
  html,body{overflow-x:hidden}
  .nav,.filters,.paper-hero+.wrap .filters,.tbl-scroll,.side{-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .nav::-webkit-scrollbar,.filters::-webkit-scrollbar,.paper-hero+.wrap .filters::-webkit-scrollbar,.tbl-scroll::-webkit-scrollbar,.side::-webkit-scrollbar{display:none}

  /* Header: ringkas & app-like */
  .top:before{height:22px;background-size:auto 22px}
  .top-in{padding:9px 14px;gap:8px 10px;align-items:center;flex-wrap:wrap}
  .brand{gap:10px;min-width:0}
  .brand img{width:38px;height:38px;box-shadow:none;filter:drop-shadow(0 2px 4px rgba(16,42,67,.3))}
  .brand h1{font-size:14px;letter-spacing:.04em}
  .brand p{display:none}
  .who{order:2;margin-left:auto;padding-left:0;border-left:0;gap:8px}

  .who .btn-p{box-shadow:0 5px 14px rgba(91,69,232,.3)}

  /* Navigasi: pill bar horizontal geser */
  .nav{order:3;width:auto;margin:3px -14px 0;padding:3px 14px 1px;display:flex;gap:7px;flex-wrap:nowrap;overflow-x:auto}
  .nav button{white-space:nowrap;background:var(--soft2);color:#536275;border-radius:999px;padding:9px 15px;font-size:13px;font-weight:700;min-height:38px}
  .nav button.on{background:linear-gradient(135deg,var(--violet),#4267e7);color:#fff}

  /* Filter: satu baris geser, edge-to-edge */
  .filters,.paper-hero+.wrap .filters{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:16px 16px 14px;scroll-snap-type:x proximity}
  .chip,.paper-hero+.wrap .chip{scroll-snap-align:start;flex:0 0 auto;min-height:38px;padding:9px 15px;font-size:13px;font-weight:700;white-space:nowrap}

  /* Kartu: lebih membulat, lega, menonjol */
  .board{padding-top:2px}
  .clip{border-radius:20px;padding:16px 16px 14px;margin-bottom:16px;box-shadow:0 10px 26px rgba(16,42,67,.12)}
  .clip img{height:190px!important;border-radius:14px!important}
  .clip h3{font-size:19px;margin-top:14px}
  .clip .lead{font-size:14.5px}
  .clip button.open{min-height:46px;font-size:14px;border-radius:12px;font-weight:800}

  /* Artikel/detail */
  .art{padding:20px 16px 60px}
  .art h2{font-size:23px}
  .art .lead{font-size:16px}
  .sec{border-radius:16px;padding:16px}
  .cut{font-size:15px}

  /* Banner literasi + tombol share */
  .lit-banner{padding:0 16px}
  .lit-inner{margin-top:16px;padding:22px 20px;border-radius:20px}
  .lit-inner h2{font-size:23px}
  .lit-inner p{font-size:14px}
  .lit-share,.clip-share{gap:8px}
  .lit-share>span,.clip-share>span{flex-basis:100%;margin-bottom:2px}
  .sh{flex:1 1 auto;justify-content:center;min-height:46px;font-size:14px;border-radius:12px}

  /* Footer + area aman ponsel */

  .toast{left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));transform:none;text-align:center}
}
.btabs{display:none}
@media(max-width:640px){.btabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(16,42,67,.10);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}.btabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:#7a828c;font-size:11px;font-weight:700;border-radius:10px;cursor:pointer}.btabs button .bi{font-size:19px;line-height:1}.btabs button.on{color:var(--violet)}body{padding-bottom:68px}}

[data-tema="gelap"] .btabs button.on{color:#b6a8ff}

/* ========== tombol MENU tunggal ========== */
.menuwrap{position:relative;margin-left:auto}
.menuwrap .menu-btn{display:inline-flex;align-items:center;gap:10px;border:0;cursor:pointer;padding:10px 18px;border-radius:999px;font-weight:800;letter-spacing:.14em;font-size:12.5px;color:#fff;background:linear-gradient(135deg,var(--violet),#4267e7 55%,var(--aqua));background-size:180% 180%;box-shadow:0 6px 18px rgba(91,69,232,.32);transition:transform .18s ease,box-shadow .18s ease,background-position .5s ease;min-height:42px}
.menuwrap .menu-btn:hover{transform:translateY(-2px);box-shadow:0 11px 26px rgba(91,69,232,.42);background-position:100% 0}
.menuwrap .menu-btn:active{transform:translateY(0)}
.menuwrap .menu-btn:focus-visible{outline:3px solid rgba(115,87,255,.45);outline-offset:2px}
.menu-bars{position:relative;width:18px;height:12px;flex:none}
.menu-bars i{position:absolute;left:0;right:0;height:2px;border-radius:2px;background:#fff;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .18s ease}
.menu-bars i:nth-child(1){top:0}
.menu-bars i:nth-child(2){top:5px}
.menu-bars i:nth-child(3){top:10px}
.menuwrap.open .menu-bars i:nth-child(1){transform:translateY(5px) rotate(45deg)}

.menuwrap.open .menu-bars i:nth-child(3){transform:translateY(-5px) rotate(-45deg)}
.menu-cur{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;letter-spacing:.02em;font-size:12.5px;opacity:.92;padding-left:10px;margin-left:2px;border-left:1px solid rgba(255,255,255,.38)}

/* ================= PENYEMPURNAAN: PAS DI HP & DESKTOP ================= */

html,body{overflow-x:hidden;max-width:100%}
img,video,canvas{max-width:100%}
.wrap{max-width:1180px}
.top-in{max-width:1180px}

/* Papan kliping: grid yang rapi, bukan kolom koran yang suka pecah */
.board{columns:auto!important;column-gap:0!important;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;align-items:stretch;padding:8px 0 40px}
.clip{display:flex;flex-direction:column;margin-bottom:0!important;border-radius:14px;box-shadow:0 6px 18px rgba(16,42,67,.07);transition:transform .16s ease,box-shadow .16s ease}
.clip:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(16,42,67,.13)}
.clip .lead{flex:1 1 auto}
.clip-img{width:100%;aspect-ratio:16/9;height:auto!important;object-fit:cover;border-radius:10px;margin-bottom:12px}
.clip-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.clip-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ink2)}
.mark{border:1px solid var(--line);background:var(--canvas);color:var(--ink2);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;min-height:34px;cursor:pointer}
.mark.on{background:var(--blue-s);border-color:#bcdcf5;color:#1a5f9e}
mark{background:#fff2a8;color:inherit;padding:0 2px;border-radius:3px}
[data-tema="gelap"] mark{background:#6a5a12;color:#fff}

/* Baris statistik pengetahuan */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:22px 0 4px}
.stat-i{background:var(--canvas);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;box-shadow:0 6px 16px rgba(16,42,67,.06)}
.stat-i .si-ic{font-size:16px;line-height:1}
.stat-i b{font-size:20px;color:var(--ink)}
.stat-i small{font-size:11px;color:var(--ink2);letter-spacing:.02em}

/* Sorotan */
.sorot{display:grid;grid-template-columns:1.1fr 1fr;gap:0;background:var(--canvas);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:18px;box-shadow:0 10px 28px rgba(16,42,67,.09)}
.sorot .sr-img{background:var(--soft2) center/cover no-repeat;min-height:230px}
.sorot .sr-tx{padding:24px 26px;display:flex;flex-direction:column;gap:8px;justify-content:center}

.sr-badge{align-self:flex-start;background:var(--lime,#b7ea5e);color:#20340a;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:5px 11px}

/* Baris alat: cari, urut, acak */
.alat{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:18px 0 2px}
.alat .cari-inp{flex:1 1 320px;max-width:none;margin:0}
.alat select{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--canvas);min-height:44px}
.alat .btn{min-height:44px;border-radius:12px}
.hasil{font-size:13px;color:var(--ink2);padding:10px 0 0}
.topik-row{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0 2px;align-items:center}
.topik-row .tlbl{font-size:12px;color:var(--ink2);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.tchip{border:1px dashed var(--line);background:transparent;color:var(--ink2);border-radius:999px;padding:6px 11px;font-size:12px;min-height:34px;cursor:pointer}
.tchip.on{background:var(--ink);border-style:solid;border-color:var(--ink);color:#fff}

/* Artikel: kontrol baca + progres */
#bacaProg{position:fixed;left:0;right:0;top:0;height:3px;background:transparent;z-index:70;pointer-events:none;display:none}
#bacaProg.on{display:block}

.art{--baca:1}

.rel{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.rel a{display:block;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--canvas);color:var(--ink);text-decoration:none}

/* Rak baca */
.rak-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}

/* Penanda luring */
#luring{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#96541f;color:#fff;font-size:12px;font-weight:700;padding:7px 14px;border-radius:999px;z-index:75;box-shadow:0 8px 20px rgba(0,0,0,.2)}

/* --- ikon tanggapan yang hidup --- */

@keyframes rksKedip{0%,100%{transform:scale(1) rotate(-2deg)}30%{transform:scale(1.1) rotate(3deg)}62%{transform:scale(.96) rotate(-4deg)}}
@keyframes rksUap{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-4deg)}}
@keyframes rksApung{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-5px) rotate(0deg)}}
@keyframes rksGoyang{0%,84%,100%{transform:rotate(0) scale(1)}88%{transform:rotate(-12deg) scale(1.04)}93%{transform:rotate(9deg) scale(1.02)}97%{transform:rotate(-4deg) scale(1)}}

.rks-e-kopi{animation:rksUap 3s ease-in-out infinite}
.rks-e-roket{animation:rksApung 2.6s ease-in-out infinite}

@keyframes rksNyala{0%{transform:scale(1)}35%{transform:scale(1.34) rotate(-8deg)}62%{transform:scale(.94) rotate(5deg)}100%{transform:scale(1)}}
@keyframes rksLuncur{0%{transform:translateY(0) rotate(-6deg)}38%{transform:translateY(-14px) scale(1.24) rotate(10deg)}100%{transform:translateY(0) rotate(-6deg)}}
@keyframes rksLedak{0%{transform:scale(1)}28%{transform:scale(1.32) rotate(-14deg)}52%{transform:scale(.9) rotate(9deg)}100%{transform:scale(1)}}
.rks-b.on .rks-e-api{animation:rksNyala .6s cubic-bezier(.2,.8,.2,1),rksKedip 1.2s ease-in-out .6s infinite}
.rks-b.on .rks-e-kopi{animation:rksNyala .6s cubic-bezier(.2,.8,.2,1),rksUap 2.2s ease-in-out .6s infinite}
.rks-b.on .rks-e-roket{animation:rksLuncur .85s cubic-bezier(.2,.8,.2,1),rksApung 2.2s ease-in-out .85s infinite}
.rks-b.on .rks-e-bom{animation:rksLedak .7s ease-out,rksGoyang 2.8s ease-in-out .7s infinite}
@keyframes rksAngka{0%{transform:translateY(6px) scale(.7);opacity:.3}60%{transform:translateY(-2px) scale(1.14)}100%{transform:translateY(0) scale(1);opacity:1}}

  {id:"m8",judul:"Ilusi Persepsi dan Halusinasi di Ketinggian",rumpun:"Keselamatan",tingkat:"Menengah",acuan:"Laporan kasus Wilderness and Environmental Medicine 2023 dan literatur third man factor",isi:"Kelelahan berat, utang tidur, dehidrasi, kadar oksigen yang menipis, dan jarak pandang buruk membuat otak menambal informasi yang hilang. Hasilnya bisa berupa sosok yang seolah terlihat, langkah kaki yang seolah terdengar, atau rasa ditemani padahal sedang sendirian. Dalam literatur kedokteran pendakian, gejala seperti ini dicatat sebagai halusinasi ketinggian dan fenomena orang ketiga, dan dibaca sebagai tanda tubuh kelebihan beban: berhenti, hangatkan diri, makan, minum, lalu pertimbangkan turun."},
  {id:"m9",judul:"Suara dan Cahaya yang Menipu di Gunung",rumpun:"Cuaca",tingkat:"Dasar",acuan:"Literatur akustik lingkungan dan meteorologi gunung",isi:"Pada malam yang cerah, lapisan udara hangat di atas udara dingin membelokkan gelombang suara sehingga bunyi dari lembah, permukiman, atau kelompok lain terdengar dekat dan riuh di punggungan. Angin yang melewati celah batu, ranting, dan tali tenda menghasilkan nada rendah serta desis yang mudah ditafsirkan sebagai keramaian atau panggilan. Kabut memantulkan cahaya lampu kepala dan memperbesar bayangan sendiri, sehingga bentuk samar tampak bergerak mendekat."}

 kliping:[
  {id:"k1",judul:"Dua pendaki turun dengan gejala hipotermia di jalur punggungan",lead:"Cuaca berubah dalam 40 menit, dan pakaian basah menjadi pemicu utamanya.",rubrik:"Bedah Insiden",media:"Tribun Timur",tautan:"https://contoh.media/berita-1",tglBerita:"2026-07-24",tglKliping:"2026-07-25",wilayah:"Sulawesi Selatan",lokasi:["Bawakaraeng"],topik:["Keselamatan","Cuaca"],potongan:"Dua pendaki dievakuasi tim gabungan pada Kamis sore setelah menunjukkan gejala hipotermia di jalur punggungan. Keduanya dilaporkan dalam keadaan sadar saat mencapai pos bawah.",konteks:"Ini kejadian keempat dengan pola yang hampir sama dalam dua tahun terakhir di kawasan yang sama: hujan sore, jaket bukan tahan angin, dan keputusan untuk terus naik meski pakaian sudah basah. Pola berulang seperti ini menandakan persoalan pengetahuan, bukan nasib.",pelajaran:["Basah lebih berbahaya daripada dingin. Ganti lapisan basah sebelum berhenti bergerak, bukan sesudahnya.","Tetapkan batas waktu balik sebelum berangkat, dan patuhi meski puncak terlihat dekat.","Bawa satu lapisan kering yang disimpan kedap air dan tidak pernah dipakai kecuali darurat."],materi:["m1","m5"],status:"Terbit",kurator:"u4",peninjau:"u3",kepekaan:"Sensitif",gambar:"Diagram sendiri"},
  {id:"k2",judul:"Kuota harian jalur pendakian dibatasi selama musim ramai",lead:"Pengelola menurunkan kuota, dan pendaftaran daring kini wajib tiga hari sebelum naik.",rubrik:"Baca Regulasi",media:"Antara",tautan:"https://contoh.media/berita-2",tglBerita:"2026-07-22",tglKliping:"2026-07-23",wilayah:"Sulawesi Selatan",lokasi:["Latimojong"],topik:["Regulasi"],potongan:"Pengelola kawasan menetapkan pembatasan kuota harian pendaki selama musim ramai. Pendaftaran dilakukan secara daring paling lambat tiga hari sebelum tanggal pendakian.",konteks:"Pembatasan kuota bukan hal baru di kawasan konservasi, namun kewajiban mendaftar tiga hari sebelumnya mengubah kebiasaan banyak kelompok yang biasa berangkat mendadak akhir pekan.",pelajaran:["Urus simaksi sebagai langkah pertama perencanaan, bukan langkah terakhir.","Simpan tangkapan layar bukti pendaftaran secara luring, sebab sinyal di pos pendaftaran sering hilang.","Siapkan jalur alternatif bila kuota penuh, dan jangan memaksa lewat jalur tidak resmi."],materi:["m7"],status:"Terbit",kurator:"u2",peninjau:"u1",kepekaan:"Biasa",gambar:"Tanpa gambar"},
  {id:"k3",judul:"Kabar keliru soal air kelapa sebagai penangan hipotermia kembali beredar",lead:"Pesan berantai ini salah dan berbahaya; penanganan hipotermia bukan soal minuman.",rubrik:"Cek Fakta",media:"Kompas",tautan:"https://contoh.media/berita-3",tglBerita:"2026-07-20",tglKliping:"2026-07-21",wilayah:"Nasional",lokasi:[],topik:["Keselamatan"],potongan:"Pesan berantai yang menyebut air kelapa dapat mengatasi hipotermia kembali menyebar di grup percakapan komunitas pendaki menjelang musim ramai.",konteks:"Klaim ini muncul berulang setiap musim pendakian. Tidak ada dasar medis yang mendukungnya, dan bahaya utamanya adalah menunda tindakan yang benar, yaitu menghentikan kehilangan panas tubuh.",pelajaran:["Prioritas pertama adalah menghentikan kehilangan panas: ganti pakaian basah, bungkus, isolasi dari tanah.","Jangan memberi minuman apa pun kepada korban yang kesadarannya menurun.","Hangatkan secara bertahap dan jangan menggosok tubuh korban."],materi:["m1","m4"],status:"Terbit",kurator:"u3",peninjau:"u1",kepekaan:"Biasa",gambar:"Ilustrasi sendiri",vonis:"Hoaks"},
  {id:"k4",judul:"Kamus Lapangan: false summit",lead:"Puncak palsu yang mematahkan semangat, dan cara membacanya lebih awal dari peta.",rubrik:"Kamus Lapangan",media:"Alpinist",tautan:"https://contoh.media/berita-4",tglBerita:"2026-07-19",tglKliping:"2026-07-19",wilayah:"Internasional",lokasi:[],topik:["Navigasi"],potongan:"Istilah false summit dipakai untuk tonjolan punggungan yang tampak seperti puncak dari jalur pendakian, padahal puncak sebenarnya masih tersembunyi di belakangnya.",konteks:"Puncak palsu bukan hanya soal kekecewaan. Ia rutin menyebabkan kelompok kehabisan air dan waktu karena perhitungan sisa perjalanan yang keliru.",pelajaran:["Baca kontur sebelum berangkat dan tandai titik tonjolan yang berpotensi menipu.","Hitung sisa perjalanan dari jarak dan beda tinggi, bukan dari apa yang terlihat mata.","Sepakati batas waktu balik yang tidak bergantung pada pencapaian puncak."],materi:["m2"],status:"Terbit",kurator:"u4",peninjau:"",kepekaan:"Biasa",gambar:"Diagram sendiri"},
  {id:"k5",judul:"Volume sampah di dua pos pendakian naik tajam pada libur panjang",lead:"Sebagian besar berupa kemasan makanan sekali pakai dan botol air minum.",rubrik:"Rubrik Sampah",media:"Detik",tautan:"https://contoh.media/berita-5",tglBerita:"2026-07-15",tglKliping:"2026-07-16",wilayah:"Sulawesi Selatan",lokasi:["Bulusaraung","Bawakaraeng"],topik:["Sampah","Konservasi"],potongan:"Pengelola mencatat kenaikan volume sampah yang diangkut dari dua pos pendakian pada libur panjang, dengan komposisi terbesar berupa kemasan sekali pakai.",konteks:"Kenaikan volume selalu mengikuti lonjakan kunjungan, namun komposisinya menunjukkan persoalan yang lebih bisa dikendalikan: kemasan yang sebenarnya bisa dihindari sejak dari rumah.",pelajaran:["Pindahkan bekal ke wadah pakai ulang sebelum berangkat untuk memotong sampah di hulu.","Bawa satu kantong khusus sampah dan timbang hasilnya sebagai kebiasaan kelompok.","Catat dan laporkan titik penumpukan kepada pengelola agar penanganannya terarah."],materi:["m6"],status:"Terbit",kurator:"u2",peninjau:"u1",kepekaan:"Biasa",gambar:"Tanpa gambar"},
  {id:"k6",judul:"Peringatan angin kencang di ketinggian selama akhir pekan",lead:"Angin puncak diperkirakan 45 kilometer per jam; rencanakan ulang jalur terbuka.",rubrik:"Baca Cuaca",media:"BMKG",tautan:"https://contoh.media/berita-6",tglBerita:"2026-07-28",tglKliping:"2026-07-29",wilayah:"Sulawesi",lokasi:["Lompobattang"],topik:["Cuaca"],potongan:"Peringatan dini menyebut potensi angin kencang di wilayah pegunungan pada akhir pekan, disertai hujan pada sore hingga malam.",konteks:"Angin 45 kilometer per jam pada suhu 12 derajat menghasilkan rasa dingin setara jauh di bawah angka itu. Inilah yang membuat jalur punggungan terbuka jadi jauh lebih berisiko daripada yang terbaca di ramalan suhu.",pelajaran:["Baca angin, bukan hanya suhu, saat menilai risiko jalur terbuka.","Pindahkan lokasi kemah ke balik punggungan atau turun satu tingkat ketinggian.","Batalkan rencana puncak bila hujan sudah turun sebelum tengah hari."],materi:["m5","m1"],status:"Ditinjau",kurator:"u4",peninjau:"u3",kepekaan:"Biasa",gambar:"Diagram sendiri"},
  {id:"k7",judul:"Sol sepatu terlepas: pola kerusakan yang paling sering dilaporkan anggota",lead:"Bukan karena dipakai terlalu sering, melainkan karena disimpan terlalu lama.",rubrik:"Lemari Gear",media:"Outside",tautan:"https://contoh.media/berita-7",tglBerita:"2026-07-10",tglKliping:"2026-07-12",wilayah:"Internasional",lokasi:[],topik:["Gear"],potongan:"Kerusakan berupa terlepasnya sol dilaporkan sebagai pola kegagalan paling umum pada sepatu gunung berusia lebih dari lima tahun, terutama yang lama tidak dipakai.",konteks:"Perekat poliuretan menua karena kelembapan dan waktu, bukan karena jarak tempuh. Sepatu yang tampak mulus di rak bisa jebol pada kilometer pertama.",pelajaran:["Periksa lekukan sol dan garis sambungan sebelum setiap perjalanan panjang.","Jangan mengandalkan sepatu yang disimpan lebih dari dua tahun tanpa uji jalan.","Selalu bawa tali cadangan atau perekat kain sebagai perbaikan darurat."],materi:[],status:"Ditulis",kurator:"u4",peninjau:"",kepekaan:"Biasa",gambar:"Tanpa gambar"},
  {id:"k8",judul:"Riset: keputusan buruk paling sering muncul pada jam keenam perjalanan",lead:"Kelelahan kognitif, bukan kelelahan fisik, yang lebih dulu merusak penilaian.",rubrik:"Terjemahan Ilmu",media:"Alpinist",tautan:"https://contoh.media/berita-8",tglBerita:"2026-06-30",tglKliping:"2026-07-02",wilayah:"Internasional",lokasi:[],topik:["Keselamatan","Navigasi"],potongan:"Sebuah tinjauan atas laporan insiden pendakian menemukan bahwa kesalahan penilaian paling sering terjadi setelah enam jam perjalanan, jauh sebelum kelelahan fisik mencapai puncaknya.",konteks:"Temuan ini menjelaskan mengapa banyak insiden justru terjadi saat perjalanan turun, ketika bagian tersulit dianggap sudah terlewati.",pelajaran:["Jadwalkan pemeriksaan bersama setiap dua jam: air, cuaca, waktu, kondisi anggota terlemah.","Ambil keputusan penting sedini mungkin, bukan saat kelelahan mulai menumpuk.","Perlakukan perjalanan turun sebagai separuh perjalanan yang paling berisiko."],materi:["m2","m3"],status:"Calon",kurator:"u3",peninjau:"",kepekaan:"Biasa",gambar:"Tanpa gambar"}
  ,{id:"k9",judul:"Kelompok pendaki tersesat setelah mengikuti jalur air saat kabut turun",lead:"Jalur air terlihat seperti jalan setapak, dan kabut menghapus semua penanda.",rubrik:"Bedah Insiden",media:"Basarnas",tautan:"https://contoh.media/berita-9",tglBerita:"2026-07-06",tglKliping:"2026-07-08",wilayah:"Sulawesi Selatan",lokasi:["Bulusaraung"],topik:["Navigasi","Keselamatan"],potongan:"Sebuah kelompok pendaki dilaporkan tersesat setelah kabut turun pada sore hari. Seluruh anggota ditemukan pada pagi berikutnya dalam kondisi selamat.",konteks:"Aliran air kering adalah penyebab tersesat yang paling sering muncul dalam laporan di kawasan ini. Bentuknya terbuka dan bersih sehingga menyerupai jalur, padahal ia menuruni lembah, bukan mengikuti punggungan.",pelajaran:["Bila kabut turun dan penanda hilang, berhenti di tempat terbuka dan jangan menuruni lembah.","Kenali beda jalur setapak dan aliran air kering: jalur mengikuti punggungan, aliran air selalu menurun.","Bawa kompas dan catat azimuth punggungan utama sebelum kabut datang."],materi:["m2","m4"],status:"Terbit",kurator:"u4",peninjau:"u1",kepekaan:"Sensitif",gambar:"Diagram sendiri"}
  ,{id:"k10",judul:"Kamus Lapangan: scree",lead:"Hamparan batu lepas yang bergerak saat dipijak, dan cara melewatinya tanpa cedera.",rubrik:"Kamus Lapangan",media:"Alpinist",tautan:"https://contoh.media/berita-10",tglBerita:"2026-07-13",tglKliping:"2026-07-13",wilayah:"Internasional",lokasi:[],topik:["Navigasi"],potongan:"Scree adalah hamparan pecahan batu lepas di lereng, yang terbentuk dari pelapukan dinding batu di atasnya dan bergerak ketika dibebani.",konteks:"Di jalur Sulawesi, hamparan seperti ini banyak ditemui pada lereng terbuka bekas kebakaran, dan menjadi penyebab umum cedera pergelangan saat perjalanan turun.",pelajaran:["Turun dengan langkah pendek dan tumit lebih dulu, jangan berlari mengikuti gravitasi.","Jaga jarak antar anggota agar batu yang terlepas tidak mengenai orang di bawah.","Lintasi menyamping bila lereng terlalu curam, jangan lurus ke bawah."],materi:["m2"],status:"Terbit",kurator:"u3",peninjau:"",kepekaan:"Biasa",gambar:"Diagram sendiri"}
  ,{id:"k11",judul:"Kabut tebal pada sore hari tercatat meningkat di lereng timur",lead:"Pola hariannya konsisten: kabut naik setelah pukul tiga, dan jarak pandang jatuh di bawah 20 meter.",rubrik:"Baca Cuaca",media:"BMKG",tautan:"https://contoh.media/berita-11",tglBerita:"2026-07-04",tglKliping:"2026-07-05",wilayah:"Sulawesi Selatan",lokasi:["Bawakaraeng"],topik:["Cuaca","Navigasi"],potongan:"Catatan pengamatan menunjukkan peningkatan frekuensi kabut tebal pada sore hari di lereng timur pegunungan, dengan jarak pandang turun drastis dalam waktu singkat.",konteks:"Kabut sore bukan peristiwa acak. Ia mengikuti pola harian naiknya udara lembap dari lembah, sehingga sebenarnya bisa diperhitungkan sejak menyusun jadwal perjalanan.",pelajaran:["Selesaikan bagian jalur yang minim penanda sebelum pukul tiga sore.","Tandai titik air dan persimpangan saat jarak pandang masih baik.","Siapkan rencana kemah lebih awal daripada memaksa mencapai pos berikutnya."],materi:["m5","m2"],status:"Terbit",kurator:"u2",peninjau:"u3",kepekaan:"Biasa",gambar:"Tanpa gambar"}
  ,{id:"k12",judul:"Cerita gerbang gaib dan pasar setan di Gunung Slamet kembali ramai dibicarakan",lead:"Kisahnya terdengar menyeramkan, namun yang berulang di baliknya adalah kabut, angin, dan jalur yang mudah salah dibaca.",rubrik:"Cek Fakta",media:"iNews",tautan:"https://semarang.inews.id/read/665282/kisah-mistis-yang-menghantui-pendaki-gunung-slamet-misteri-gerbang-gaib-hingga-pasar-setan",tglBerita:"2026-01-09",tglKliping:"2026-08-05",wilayah:"Nasional",lokasi:["Slamet"],topik:["Mistis","Navigasi","Keselamatan"],potongan:"Laporan itu menyebut sejumlah pendaki merasakan kehadiran sosok tak terlihat yang seolah mengawasi setiap langkah mereka. Kisah pasar setan disebut sebagai salah satu cerita paling terkenal di kalangan pendaki, terutama ketika kabut tebal turun pada malam hari.",konteks:"Cerita semacam ini hampir selalu menempel pada jenis tempat yang sama: sadel terbuka, percabangan tanpa penanda, dan tikungan yang cepat tertutup kabut. Titik-titik itu memang paling sering membuat orang kehilangan arah, sehingga wajar bila generasi sebelumnya menitipkan peringatan lewat cerita, bukan lewat peta. Keyakinan warga sekitar layak dihormati sebagai bagian dari budaya kawasan, dan kliping ini tidak menilai benar atau salahnya keyakinan itu. Yang diperiksa adalah hal yang bisa diukur: cuaca, jarak pandang, kualitas penanda jalur, dan jam berapa kabut biasanya naik. Vonis ditulis belum diverifikasi karena klaim keberadaan sosok gaib berada di luar jangkauan pembuktian, sementara risiko jalurnya justru sangat terukur.",pelajaran:["Perlakukan titik yang dianggap keramat sebagai penanda bahaya, bukan arena uji nyali. Tandai di peta sebagai zona hati-hati karena hampir semuanya berada di sadel terbuka, percabangan samar, atau tikungan berkabut.","Bila mendengar suara keramaian atau merasa dipanggil, berhenti, kumpulkan kelompok, hitung ulang anggota, lalu periksa arah dengan kompas. Jangan pernah memisahkan diri untuk memastikan sumber suara.","Hormati adat dan pantangan setempat sebagai sopan santun terhadap tuan rumah, tetapi keputusan naik atau turun tetap disandarkan pada cuaca, sisa cahaya matahari, cadangan air, dan kondisi anggota terlemah."],materi:["m9","m2"],status:"Terbit",kurator:"u2",peninjau:"u3",kepekaan:"Biasa",gambar:"Ilustrasi sendiri",gbrKet:"Sketsa sadel terbuka berkabut, jenis lokasi yang paling sering dikaitkan dengan cerita pasar setan",vonis:"Belum diverifikasi"}
  ,{id:"k13",judul:"Pendaki hilang dalam hitungan menit, kabar mistis menyebar lebih cepat daripada data",lead:"Narasi gaib mengisi kekosongan informasi pada jam-jam pertama pencarian.",rubrik:"Bedah Insiden",media:"Detik",tautan:"https://news.detik.com/berita-jawa-timur/d-5082678/cerita-mistis-seputar-hilangnya-pendaki-di-gunung-lawu",tglBerita:"2020-07-06",tglKliping:"2026-08-05",wilayah:"Nasional",lokasi:["Lawu"],topik:["Keselamatan","Navigasi","Mistis"],potongan:"Seorang pendaki remaja dilaporkan hilang tak lama setelah terakhir terlihat bersama rekannya di sekitar tenda. Rekan satu rombongan menyebut ia menghilang dalam rentang sekitar lima menit, dan kabar itu segera dibalut cerita mistis yang selama ini melekat pada kawasan tersebut.",konteks:"Pola yang berulang dalam banyak laporan pencarian sebenarnya mirip: seseorang keluar tenda pada malam hari, jarak pandang hanya sebatas sorot lampu kepala, suhu turun, dan arah pulang menjadi kabur hanya beberapa langkah dari tenda. Di kawasan dengan tradisi cerita yang kuat, kekosongan informasi pada jam-jam pertama cepat terisi dugaan gaib, sementara keterangan resmi baru muncul beberapa hari kemudian. Sesuai pedoman ruang kliping, sebab kejadian tidak disimpulkan sebelum ada keterangan SAR atau pengelola kawasan, dan nama siapa pun yang terlibat tidak ditulis. Yang dibedah di sini rantai keputusannya, bukan orangnya.",pelajaran:["Tidak ada anggota yang keluar tenda sendirian pada malam hari. Sepakati aturan berpasangan, bawa lampu, dan beri tahu arah serta perkiraan lama perginya.","Catat waktu dan titik terakhir seseorang terlihat begitu ia tidak kembali. Lima keterangan, yaitu siapa, berapa orang, titik terakhir, kondisi, dan perlengkapan, jauh lebih menolong tim pencari daripada dugaan apa pun.","Tahan diri menyebar dugaan penyebab selama pencarian berjalan. Menunggu keterangan resmi melindungi keluarga yang sedang cemas dan menjaga fokus tim di lapangan."],materi:["m4","m8"],status:"Terbit",kurator:"u4",peninjau:"u1",kepekaan:"Sensitif",gambar:"Diagram sendiri",gbrKet:"Diagram jarak pandang lampu kepala saat kabut malam, disusun dari catatan lapangan anggota"}
  ,{id:"k14",judul:"Sosok yang dianggap menyesatkan pendaki dan apa yang terjadi pada otak yang kelelahan",lead:"Rasa ditemani sosok tak terlihat sudah lama tercatat dalam literatur kedokteran pendakian.",rubrik:"Terjemahan Ilmu",media:"Detik",tautan:"https://news.detik.com/berita/d-4615744/cerita-hantu-yang-sesatkan-pendaki-gunung-halusinasi-atau-nyata",tglBerita:"2019-07-08",tglKliping:"2026-08-05",wilayah:"Nasional",lokasi:[],topik:["Mistis","Keselamatan"],potongan:"Pemberitaan hilangnya seorang pendaki muda di kawasan pegunungan Jawa Timur sempat memantik cerita hantu yang melingkupi aktivitas pendakian. Pertanyaan yang kemudian diangkat: halusinasi atau nyata?",konteks:"Rasa ditemani sosok tak terlihat bukan hanya hidup di cerita malam. Sebuah laporan kasus di jurnal kedokteran alam liar mencatat pendaki sangat berpengalaman yang merasakan kehadiran seseorang dan melihat cahaya lampu yang sebenarnya tidak ada, saat turun dari puncak pada ketinggian sekitar 7.500 meter, dan gejalanya hilang sendiri setelah ia mencapai kemah. Pemicunya bukan satu hal, melainkan tumpukan: oksigen menipis, kurang tidur, kelelahan, dehidrasi, gangguan elektrolit, jarak pandang buruk, rasa terisolasi, dan takut. Di gunung tropis yang jauh lebih rendah, penipisan oksigen tidak sedrastis itu, sehingga utang tidur, dingin, dan kelelahan biasanya menjadi kombinasi utamanya. Otak juga terbiasa melengkapi pola yang tidak utuh, sehingga bayangan di kabut dan derau angin mudah terbaca sebagai wajah atau suara. Penjelasan ini tidak dimaksudkan menertawakan pengalaman siapa pun, sebab yang dirasakan memang nyata bagi yang mengalaminya, dan justru berguna sebagai peringatan dini.",pelajaran:["Baca halusinasi, bisikan, atau rasa ditemani sebagai alarm tubuh, bukan bahan cerita seru. Alarm ini biasanya menyala setelah utang tidur dan kelelahan menumpuk, jadi berhenti, hangatkan diri, makan, minum, lalu tidur bila keadaan aman.","Jangan mengambil keputusan besar seperti mengubah jalur, memisahkan diri, atau memaksa puncak ketika persepsi sedang tidak bisa dipercaya. Tunggu terang, atau serahkan keputusan kepada anggota yang paling segar.","Buka ruang bercerita tanpa ditertawakan sepulang pendakian. Kelompok yang aman adalah kelompok yang anggotanya berani mengaku sedang tidak beres, sehingga gejala kelelahan berat terdeteksi lebih awal."],materi:["m8","m1"],status:"Terbit",kurator:"u3",peninjau:"u1",kepekaan:"Biasa",gambar:"Ilustrasi sendiri",gbrKet:"Ilustrasi sendiri: siluet pendaki dan bayangan lampu kepala di kabut"}

function mulaiNotifUsulan(){
  if(_usPoll)return;
  (db.usulan||[]).forEach(function(u){_usTahu[u.id]=1});
  _usPoll=setInterval(cekUsulanBaru,60000);

async function cekUsulanBaru(){
  if(!S||!S.me||!db)return;
  try{
    var r=await supa.from("usulan").select("*");
    if(r.error)return;
    var data=r.data||[];
    var masuk=data.filter(function(u){return u.status==="Baru"&&!_usTahu[u.id]});
    data.forEach(function(u){_usTahu[u.id]=1});
    var berubah=data.length!==(db.usulan||[]).length;
    if(!masuk.length&&!berubah)return;
    db.usulan=data;
    if(!S.draft)render();
    if(masuk.length){
      toast("\u2709 "+masuk.length+" usulan baru dari pembaca masuk!");
      notifDesktop("Usulan Pembaca baru",masuk.length+" cerita menunggu direspons di panel Usulan Pembaca.");
      bunyiNotif();
    }
  }catch(e){}
}
function notifDesktop(judul,isi){

function bunyiNotif(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    var ctx=new AC(),o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);o.frequency.value=880;g.gain.value=.06;
    o.start();o.stop(ctx.currentTime+.18);o.onended=function(){try{ctx.close()}catch(e){}};
  }catch(e){}
}

function _kigWrap(ctx,text,maxW){
  var words=String(text||"").split(/\s+/).filter(Boolean);var lines=[];var cur="";
  for(var i=0;i<words.length;i++){
    var test=cur?cur+" "+words[i]:words[i];
    if(ctx.measureText(test).width>maxW&&cur){lines.push(cur);cur=words[i]}else cur=test;
  }
  if(cur)lines.push(cur);
  return lines;
}
function _kigRound(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
var _kigImgCache={};
function _kigLoadImg(src){
  if(_kigImgCache[src])return _kigImgCache[src];
  var img=new Image();
  var entry={img:img,loaded:false};
  entry.ready=new Promise(function(res){
    img.onload=function(){entry.loaded=true;res(img)};
    img.onerror=function(){res(null)};
  });
  img.src=src;
  _kigImgCache[src]=entry;
  return entry;
}
function _kigBgUntukFormat(fmt){
  return fmt==="kotak"?"reichas_ig_card_hero.png":"tiktok_vertical_card_reichas.png";
}
function _kigGambarLatar(ctx,W,H,entry){
  if(entry&&entry.img&&entry.loaded&&entry.img.naturalWidth){
    var iw=entry.img.naturalWidth,ih=entry.img.naturalHeight;
    var scale=Math.max(W/iw,H/ih);
    var dw=iw*scale,dh=ih*scale;
    ctx.drawImage(entry.img,(W-dw)/2,(H-dh)/2,dw,dh);
  }else{
    var g=ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0,"#102a43");g.addColorStop(1,"#1b1330");
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  var ov=ctx.createLinearGradient(0,0,0,H);
  ov.addColorStop(0,"rgba(9,13,20,0.6)");ov.addColorStop(0.55,"rgba(9,13,20,0.42)");ov.addColorStop(1,"rgba(9,13,20,0.88)");
  ctx.fillStyle=ov;ctx.fillRect(0,0,W,H);
}
function kartuIGGambar(){
  var can=document.getElementById("kartuCv");if(!can)return;
  var id=S.modal&&S.modal.id;var k=db.kliping.find(function(x){return x.id===id});if(!k)return;
  var fmt=(S.modal&&S.modal.fmt)||"kotak";
  var W=1080,H=fmt==="kotak"?1080:1920;
  can.width=W;can.height=H;
  var ctx=can.getContext("2d");
  var bgEntry=_kigLoadImg(_kigBgUntukFormat(fmt));
  function gambar(){
    if(!document.getElementById("kartuCv")||!S.modal||S.modal.type!=="kartuIG")return;
    ctx.clearRect(0,0,W,H);
    _kigGambarLatar(ctx,W,H,bgEntry);
    ctx.fillStyle="rgba(255,255,255,0.06)";
    ctx.beginPath();ctx.arc(W*0.86,H*0.1,W*0.34,0,Math.PI*2);ctx.fill();
    ctx.textBaseline="top";
    var padX=Math.round(W*0.09);
    var safeBottom=fmt==="tiktok"?Math.round(H*0.24):Math.round(H*0.09);
    var y=Math.round(H*0.07);
    ctx.fillStyle="#fff";ctx.font="700 34px Outfit, sans-serif";
    ctx.fillText("KLIPING RCS.CBS",padX,y);
    y+=58;
    var tagLbl=isOpini(k)?"\u270d Buah Pikir":(k.rubrik||"");
    if(tagLbl){
      ctx.font="600 25px Outfit, sans-serif";
      var tw=ctx.measureText(tagLbl).width;var pillW=tw+42,pillH=48;
      ctx.fillStyle="rgba(255,255,255,0.16)";_kigRound(ctx,padX,y,pillW,pillH,24);ctx.fill();
      ctx.fillStyle="#fff";ctx.fillText(tagLbl,padX+21,y+11);
      y+=pillH+16;
    }
    if(k.vonis&&k.vonis!=="\u2014"){
      var vc={"Fakta":"#3fae72","Sebagian benar":"#d5803b","Menyesatkan":"#d5803b","Hoaks":"#e0554b","Belum diverifikasi":"#7c8896"}[k.vonis]||"#7c8896";
      ctx.font="700 24px Outfit, sans-serif";
      var vt="\u2696 "+k.vonis;var vw=ctx.measureText(vt).width;var vpw=vw+36,vph=44;
      ctx.fillStyle=vc;_kigRound(ctx,padX,y,vpw,vph,22);ctx.fill();
      ctx.fillStyle="#fff";ctx.fillText(vt,padX+18,y+10);
      y+=vph+26;
    }else y+=18;
    var maxW=W-padX*2;
    var judulSize=fmt==="kotak"?58:64;
    ctx.font="800 "+judulSize+"px Georgia, serif";ctx.fillStyle="#fff";
    var lines=_kigWrap(ctx,k.judul,maxW).slice(0,6);
    lines.forEach(function(ln){ctx.fillText(ln,padX,y);y+=Math.round(judulSize*1.16)});
    y+=16;
    if(k.lead){
      ctx.font="400 29px 'Plus Jakarta Sans', sans-serif";ctx.fillStyle="rgba(255,255,255,0.82)";
      var maxLeadY=H-safeBottom-90;
      var leadLines=_kigWrap(ctx,k.lead,maxW);
      for(var i=0;i<leadLines.length&&y<maxLeadY;i++){ctx.fillText(leadLines[i],padX,y);y+=40}
    }
    var fy=H-safeBottom;
    ctx.strokeStyle="rgba(255,255,255,0.28)";ctx.beginPath();ctx.moveTo(padX,fy-28);ctx.lineTo(W-padX,fy-28);ctx.stroke();
    ctx.font="700 27px Outfit, sans-serif";ctx.fillStyle="#fff";
    ctx.fillText("kliping-reichas.my.id",padX,fy);
    ctx.font="400 23px 'Plus Jakarta Sans', sans-serif";ctx.fillStyle="rgba(255,255,255,0.72)";
    ctx.fillText("Baca selengkapnya \u2014 tautan lengkap di bio/keterangan",padX,fy+38);
  }
  gambar();
  if(!bgEntry.loaded)bgEntry.ready.then(gambar);
}

/* ================= PODCAST CONTINUOUS PLAYER ================= */
let PODCAST = { active: false, queue: [], idx: 0, playing: false, paused: false };

function mulaiPodcast(idx) {
  if (!("speechSynthesis" in window)) {
    toast("Peramban tidak mendukung fitur pemutar suara");
    return;
  }
  const list = terbit().sort((a,b) => b.tglKliping.localeCompare(a.tglKliping));
  if (!list.length) { toast("Belum ada kliping terbit untuk diputar"); return; }
  
  PODCAST.queue = list;
  PODCAST.idx = (typeof idx === "number" && idx >= 0 && idx < list.length) ? idx : 0;
  PODCAST.active = true;
  PODCAST.playing = true;
  PODCAST.paused = false;
  
  putarPodcastTrack();
}

function putarPodcastTrack() {
  if (!PODCAST.active || !PODCAST.queue.length) return;
  const k = PODCAST.queue[PODCAST.idx];
  if (!k) { tutupPodcast(); toast("Podcast selesai diputar!"); return; }
  
  const synth = window.speechSynthesis;
  synth.cancel();
  
  const chunks = ttsText(k).match(/[^.!?]+[.!?]*/g) || [ttsText(k)];
  const voice = ttsBest();
  let i = 0;
  
  PODCAST.playing = true;
  PODCAST.paused = false;
  tampilPodcastBar();
  
  (function nextChunk() {
    if (!PODCAST.active || !PODCAST.playing || PODCAST.paused) return;
    if (i >= chunks.length) {
      PODCAST.idx++;
      if (PODCAST.idx < PODCAST.queue.length) {
        toast("Melanjutkan ke: " + PODCAST.queue[PODCAST.idx].judul);
        setTimeout(putarPodcastTrack, 1000);
      } else {
        tutupPodcast();
        toast("Semua podcast kliping selesai diputar 🎉");
      }
      return;
    }
    
    const u = new SpeechSynthesisUtterance((chunks[i] || "").trim());
    u.lang = voice ? voice.lang : "id-ID";
    if (voice) u.voice = voice;
    u.rate = 0.96;
    u.pitch = 1.0;
    u.onend = function() { i++; nextChunk(); };
    u.onerror = function() { i++; nextChunk(); };
    synth.speak(u);
  })();
}

function podcastTogglePlay() {
  if (!("speechSynthesis" in window)) return;
  const synth = window.speechSynthesis;
  if (PODCAST.paused) {
    synth.resume();
    PODCAST.paused = false;
    PODCAST.playing = true;
  } else {
    synth.pause();
    PODCAST.paused = true;
    PODCAST.playing = false;
  }
  tampilPodcastBar();
}

function podcastNext() {
  if (!PODCAST.queue.length) return;
  PODCAST.idx = (PODCAST.idx + 1) % PODCAST.queue.length;
  putarPodcastTrack();
}

function podcastPrev() {
  if (!PODCAST.queue.length) return;
  PODCAST.idx = (PODCAST.idx - 1 + PODCAST.queue.length) % PODCAST.queue.length;
  putarPodcastTrack();
}

function tutupPodcast() {
  PODCAST.active = false;
  PODCAST.playing = false;
  PODCAST.paused = false;
  try { if ("speechSynthesis" in window) window.speechSynthesis.cancel(); } catch(e) {}
  const bar = document.getElementById("podcastBar");
  if (bar && bar.parentNode) bar.parentNode.removeChild(bar);
}

function tampilPodcastBar() {
  if (!PODCAST.active) return;
  const k = PODCAST.queue[PODCAST.idx];
  if (!k) return;
  
  let bar = document.getElementById("podcastBar");
  if (!bar) {
    bar = document.createElement("div");
    bar.id = "podcastBar";
    bar.className = "podcast-bar";
    document.body.appendChild(bar);
  }
  
  const statusIcon = PODCAST.paused ? "▶️" : "⏸️";
  const numStr = (PODCAST.idx + 1) + " / " + PODCAST.queue.length;
  
  bar.innerHTML = '<div class="podcast-left">' +
    '<span class="podcast-wave' + (PODCAST.paused ? "" : " on") + '"><i></i><i></i><i></i></span>' +
    '<div class="podcast-txt">' +
      '<div class="podcast-top"><span class="tag tag-b" style="font-size:10px;padding:1px 6px">📻 PODCAST</span> <small style="color:rgba(255,255,255,0.75)">' + numStr + '</small></div>' +
      '<b class="podcast-t">' + esc(k.judul) + '</b>' +
    '</div>' +
  '</div>' +
  '<div class="podcast-acts">' +
    '<button type="button" class="pc-btn" onclick="podcastPrev()" title="Sebelumnya">⏮️</button>' +
    '<button type="button" class="pc-btn pc-main" onclick="podcastTogglePlay()" title="Putar/Jeda">' + statusIcon + '</button>' +
    '<button type="button" class="pc-btn" onclick="podcastNext()" title="Berikutnya">⏭️</button>' +
    '<button type="button" class="pc-btn pc-close" onclick="tutupPodcast()" title="Tutup">✕</button>' +
  '</div>';
}

function ttsScore(v){var n=(v.name||"").toLowerCase();return /google|natural|neural|wavenet|enhanced|premium/.test(n)?0:1}
function _ttsLang(v){return String((v&&v.lang)||"").replace(/_/g,"-").toLowerCase()}
function ttsID(v){var l=_ttsLang(v),n=String((v&&v.name)||"").toLowerCase();return /^(id|in|ind)(-|$)/.test(l)||n.indexOf("indonesia")>=0||n.indexOf("damayanti")>=0}
function ttsEN(v){var l=_ttsLang(v);return l==="en"||l==="en-us"||l==="en-gb"}

function ttsVoiceOptions(){
  var vs=ttsVoices().filter(ttsPakai);
  if(!vs.length)return '<option value="">(memuat suara\u2026)</option>';
  var pref="";try{pref=localStorage.getItem("ttsVoice")||""}catch(e){}
  var urut=function(a,b){return ttsScore(a)-ttsScore(b)};
  var id=vs.filter(ttsID).sort(urut);
  var en=vs.filter(function(v){return ttsEN(v)&&!ttsID(v)}).sort(urut);
  function op(v){return '<option value="'+esc(v.name)+'"'+(v.name===pref?" selected":"")+'>'+esc(v.name+" ("+v.lang+")")+"</option>"}
  var h="";
  if(id.length)h+='<optgroup label="Bahasa Indonesia">'+id.map(op).join("")+"</optgroup>";
  else h+='<optgroup label="Bahasa Indonesia"><option value="" disabled>Belum terpasang di perangkat ini</option></optgroup>';
  if(en.length)h+='<optgroup label="English">'+en.map(op).join("")+"</optgroup>";
  return h;
}
function ttsBest(){
  var vs=ttsVoices().filter(ttsPakai);
  var pref="";try{pref=localStorage.getItem("ttsVoice")||""}catch(e){}
  var urut=function(a,b){return ttsScore(a)-ttsScore(b)};
  var v=null;
  if(pref)v=vs.find(function(x){return x.name===pref});
  if(!v)v=vs.filter(ttsID).sort(urut)[0];

}

async function hapusPengguna(id){
  const u=user(id);if(!u)return;
  var _pk=me().peran;if(_pk!=="Super-Admin"&&!(_pk==="Admin"&&u.peran==="Kurator")){toast("Admin hanya dapat menghapus akun Kurator");return}
  if(id===S.me){toast("Tidak bisa menghapus akun sendiri");return}
  if(u.peran==="Super-Admin"&&db.pengguna.filter(x=>x.peran==="Super-Admin").length<=1){toast("Minimal harus ada satu Super-Admin");return}
  if(!confirm("Hapus pengguna \""+u.nama+"\"? Tindakan ini permanen."))return;
  toast("Menghapus "+u.nama+"\u2026");
  var res;
  try{res=await supa.from("profiles").delete().eq("id",id).select()}catch(e){res={error:e}}
  if(res.error){toast("Gagal menghapus di server: "+(res.error.message||res.error));return}
  if(!res.data||!res.data.length){
    var r2;
    try{r2=await supa.from("profiles").update({aktif:false}).eq("id",id).select()}catch(e){r2={error:e}}
    if(r2.error||!r2.data||!r2.data.length){toast("Server menolak: kebijakan RLS tabel profiles belum mengizinkan hapus")}
    else{log("Menonaktifkan akun (hapus ditolak server)",u.nama);toast("Hapus ditolak server \u2014 akun dinonaktifkan")}
    await bootstrap();return;
  }
  log("Menghapus pengguna",u.nama);
  db.pengguna=db.pengguna.filter(x=>x.id!==id);
  render();toast("Pengguna dihapus");
  await bootstrap();
}

function initGA() {

function catatTrafik(halamanId) {
  try {
    const d = new Date().toISOString().slice(0,10);
    const dev = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ? "HP" : "Desktop";
    let tr = {};
    try { tr = JSON.parse(localStorage.getItem("rcs_trafik") || "{}") || {}; } catch(e){}
    
    tr[d] = tr[d] || { hits: 0, hp: 0, desktop: 0, pages: {} };
    tr[d].hits++;
    if (dev === "HP") tr[d].hp++; else tr[d].desktop++;
    
    if (halamanId) {
      tr[d].pages[halamanId] = (tr[d].pages[halamanId] || 0) + 1;
    }
    
    localStorage.setItem("rcs_trafik", JSON.stringify(tr));
    if (typeof window.va === "function") {
      window.va("event", { name: "baca_halaman", data: { halaman: halamanId || "Papan Kliping" } });
    }
  } catch(e){}
}

  keys.forEach(k => {

    return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">' +

  return '<div class="card" style="margin-top:16px"><b style="font-size:15px;display:flex;align-items:center;gap:8px">📈 Analitik Pengunjung &amp; Trafik (Vercel Analytics)</b>' +

function bacaBerkasKliping(input){
  if(!bolehImporMistis()){toast("Tombol impor ini hanya tersedia untuk akun tertentu");return}
  var berkas=input.files&&input.files[0];
  if(!berkas)return;
  var status=document.getElementById("statusImporMistis");
  if(status)status.textContent="Membaca "+berkas.name+"...";
  var pembaca=new FileReader();
  pembaca.onload=function(e){
    var data;
    try{data=JSON.parse(e.target.result)}catch(err){
      toast("Berkas bukan JSON yang valid: "+err.message);
      if(status)status.textContent="";
      input.value="";
      return;
    }
    prosesImporBerkasKliping(data).then(function(){input.value="";if(status)status.textContent=""});
  };
  pembaca.onerror=function(){toast("Gagal membaca berkas");input.value="";if(status)status.textContent=""};
  pembaca.readAsText(berkas,"utf-8");
}

async function prosesImporBerkasKliping(data){
  if(!bolehImporMistis()){toast("Tombol impor ini hanya tersedia untuk akun tertentu");return}
  if(!data||typeof data!=="object"){toast("Format berkas tidak dikenali, seharusnya objek JSON");return}
  var materiBaru=Array.isArray(data.materi)?data.materi:[];
  var klipingBaru=Array.isArray(data.kliping)?data.kliping:[];
  var mediaBaru=Array.isArray(data.mediaBaru)?data.mediaBaru:[];
  if(!materiBaru.length&&!klipingBaru.length){toast("Berkas tidak berisi materi atau kliping apa pun");return}

  var wajib=["id","judul","lead","rubrik","media","tautan","potongan","konteks","status"];
  for(var i=0;i<klipingBaru.length;i++){
    var k=klipingBaru[i]||{};
    for(var j=0;j<wajib.length;j++){
      if(k[wajib[j]]===undefined||k[wajib[j]]===null||k[wajib[j]]===""){
        toast("Kliping ke-"+(i+1)+" ("+(k.id||"tanpa id")+") belum mengisi kolom \""+wajib[j]+"\"");
        return;
      }
    }
    var isiPelajaran=(Array.isArray(k.pelajaran)?k.pelajaran:[]).filter(function(x){return x&&String(x).trim()});
    if(isiPelajaran.length<3){
      toast("Kliping \""+k.id+"\" harus punya 3 poin pelajaran yang terisi");
      return;
    }
  }
  for(var mIdx=0;mIdx<materiBaru.length;mIdx++){
    if(!materiBaru[mIdx]||!materiBaru[mIdx].id||!materiBaru[mIdx].judul){
      toast("Materi ke-"+(mIdx+1)+" belum mengisi id atau judul");
      return;
    }
  }

  if(!confirm("Impor "+klipingBaru.length+" kliping dan "+materiBaru.length+" materi dari berkas ini ke basis data?"))return;

  try{
    toast("Mengimpor berkas...");
    if(materiBaru.length){
      var rm=await supa.from("materi").upsert(materiBaru);
      if(pErr(rm.error,"materi"))return;
    }
    for(var s=0;s<mediaBaru.length;s++){
      try{await supa.from("media").upsert({nama:mediaBaru[s]},{onConflict:"nama",ignoreDuplicates:true})}catch(e){}
    }
    if(klipingBaru.length){
      var baris=klipingBaru.map(function(d){
        var c=Object.assign({},d);
        c.kurator=c.kurator||S.me;
        c.pelajaran=Array.isArray(c.pelajaran)?c.pelajaran.slice():[];
        while(c.pelajaran.length<3)c.pelajaran.push("");
        return toKliping(c);
      });
      var rk=await supa.from("kliping").upsert(baris);
      if(pErr(rk.error,"kliping"))return;
    }
    log("Mengimpor bahan kliping dari berkas",klipingBaru.map(function(k){return k.id}).join(", ")||"(hanya materi)");
    await bootstrap();
    toast("Berhasil mengimpor "+klipingBaru.length+" kliping dan "+materiBaru.length+" materi");
  }catch(e){
    console.error(e);
    toast("Gagal mengimpor: "+(e.message||e));
  }
}

function isImg(g){return typeof g==="string"&&g.slice(0,4)==="http";}
function kompresGambar(file){return new Promise(function(res){try{const url=URL.createObjectURL(file);const img=new Image();img.onload=function(){try{const M=1600;let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;const sc=Math.min(1,M/Math.max(w,h));w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));const cv=document.createElement("canvas");cv.width=w;cv.height=h;const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);let q=0.85;(function step(){cv.toBlob(function(b){if(b&&b.size>290*1024&&q>0.5){q-=0.12;step();}else res(b||null);},"image/jpeg",q);})();}catch(e){res(null);}};img.onerror=function(){URL.revokeObjectURL(url);res(null);};img.src=url;}catch(e){res(null);}});}
async function uploadGambar(file){
  try{
    if(file.size>10*1024*1024){toast("Ukuran gambar maksimal 10 MB");return null;}
    let body=file,ext=((file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,""))||"jpg",ctype=file.type||"image/jpeg";
    const kb=await kompresGambar(file);
    if(kb){body=kb;ext="jpg";ctype="image/jpeg";}
    else{
      const amanFormat=/^image\/(jpeg|jpg|png|webp|gif)$/i.test(file.type||"");
      if(!amanFormat||file.size>900*1024){
        toast("Gambar ini tidak bisa dikecilkan peramban (kemungkinan format HEIC dari iPhone). Simpan ulang sebagai JPEG, lalu unggah lagi.");
        return null;
      }
    }
    const path="kliping/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+ext;
    const up=await supa.storage.from("gambar-kliping").upload(path,body,{cacheControl:"3600",upsert:false,contentType:ctype});
    if(up.error){toast("Gagal unggah: "+up.error.message);return null;}
    return supa.storage.from("gambar-kliping").getPublicUrl(path).data.publicUrl;
  }catch(e){toast("Gagal unggah gambar");return null;}
}

function periksa(d,status){
  const e=[];
  if(!d.judul)e.push("Judul kliping belum diisi.");
  if(!d.lead)e.push("Ringkasan satu baris belum diisi.");
  if(!d.tautan)e.push("Tautan sumber asli wajib diisi.");
  if(!d.potongan)e.push("Bagian Potongan belum diisi.");
  if(!d.konteks)e.push("Bagian Konteks belum diisi.");
  if(d.pelajaran.filter(x=>x).length<3)e.push("Bagian Pelajaran harus berisi tiga poin.");
  if(!d.materi.length)e.push("Wajib menaut minimal satu halaman materi.");
  if(status==="Terbit"&&db.settings.wajibTinjauan&&db.sensitif.includes(d.rubrik)&&!d.peninjau)e.push("Rubrik sensitif wajib punya peninjau sebelum terbit.");
  return e;
}
function simpanDraft(status){
  ambil();const d=S.draft;
  if(status==="Ditulis"){
    if(!d.judul){S.err=["Judul kliping belum diisi."];render();return}
  }else{
    const e=periksa(d,status);
    if(e.length){S.err=e;render();toast("Periksa "+e.length+" hal yang belum lengkap");return}
  }
  d.status=status;if(status==="Ditinjau"||status==="Terbit")d.catatan="";S.err=[];
  if(d.id){db.kliping=db.kliping.map(k=>k.id===d.id?d:k);log(status==="Terbit"?"Menerbitkan kliping":"Memperbarui kliping",d.judul)}
  else{d.id=slugBaruUntuk(d);db.kliping.unshift(d);log(status==="Terbit"?"Menerbitkan kliping baru":"Membuat kliping",d.judul)}
  supa.from("kliping").upsert(toKliping(d)).then(({error})=>{if(!pErr(error,"kliping"))hapusDrafLokal();});
  S.draft=null;go({av:status==="Ditinjau"?"tinjauan":"kliping"});
  toast(status==="Terbit"?"Kliping diterbitkan":status==="Ditinjau"?"Diajukan untuk ditinjau":"Draf disimpan");
}
function setuju(id){
