<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WARNAI — Rehat Sejenak</title>
<style>
:root{--ink:#26302b;--muted:#6b746e;--green:#2e7d4f;--gold:#ffce4a;--paper:#fbfaf7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#e9f3ec,#fff8e5);color:var(--ink)}
body{display:flex;justify-content:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
#app{width:min(100%,460px);min-height:100dvh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0 10px}
.back{color:var(--ink);text-decoration:none;border:1px solid rgba(38,48,43,.18);border-radius:999px;padding:10px 14px;font-weight:700;font-size:13px;background:rgba(255,255,255,.6);min-height:44px}
.brand{font-weight:900;letter-spacing:.12em;color:var(--green);font-size:13px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:8px 0 18px}
.eyebrow{color:#ad7610;font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
h1{margin:0;font-size:clamp(30px,9vw,44px);letter-spacing:.04em;text-align:center}
h1 span{color:#e0a926}
.intro{text-align:center;color:var(--muted);font-size:14px;line-height:1.5;max-width:350px}
#hud{display:flex;gap:8px;width:min(100%,360px)}
.stat{flex:1;text-align:center;background:rgba(255,255,255,.75);border:1px solid rgba(38,48,43,.12);border-radius:12px;padding:8px;font-size:12px;color:var(--muted)}
.stat b{display:block;color:var(--ink);font-size:20px;line-height:1.1}
#board{width:min(82vw,330px);aspect-ratio:1;border-radius:24px;padding:9px;background:#26302b;box-shadow:0 18px 42px rgba(44,65,52,.22);display:grid;grid-template-columns:repeat(4,1fr);gap:7px;touch-action:manipulation}
.cell{border:0;border-radius:12px;min-width:0;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,255,255,.45),0 3px 7px rgba(0,0,0,.16);transition:transform .12s,filter .12s}
.cell .target-dot{display:block;width:24px;height:24px;margin:auto;border-radius:50%;background:var(--target);box-shadow:0 0 0 3px rgba(255,255,255,.78),0 2px 7px rgba(0,0,0,.18)}
.cell.done .target-dot{display:none}
.cell:active{transform:scale(.94)}
.cell.done{filter:saturate(1.2) brightness(1.05);box-shadow:inset 0 0 0 3px #fff,0 0 0 3px var(--green)}
.cell.wrong{animation:bad .24s ease}
@keyframes bad{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#palette{display:flex;width:100%;min-height:44px;gap:10px;justify-content:center;flex-wrap:wrap;max-width:340px}
.swatch{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.9);box-shadow:0 3px 8px rgba(0,0,0,.18);cursor:pointer}
.swatch.selected{outline:3px solid var(--ink);outline-offset:3px}
#message{min-height:22px;text-align:center;font-weight:800;color:var(--green);font-size:14px}
.btn{border:0;border-radius:14px;background:linear-gradient(180deg,#ffe08a,#ffbf2f);color:#3a2a00;font-size:16px;font-weight:900;padding:14px 30px;min-height:52px;box-shadow:0 10px 22px rgba(180,124,20,.2);cursor:pointer}
.hint{color:var(--muted);font-size:12px;text-align:center}
.hidden{display:none!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top"><a class="back" href="./">← Papan Skor</a><div class="brand">RCS.CBS</div></header>
  <main>
    <div class="eyebrow">Prototype · Game ke-4</div>
    <h1>WARNAI <span>LOSARI</span></h1>
    <p class="intro">Lihat titik warna di setiap bidang. Pilih warna yang sama, lalu ketuk bidangnya sebelum waktu habis.</p>
    <div id="hud"><div class="stat">Waktu<b id="time">60</b></div><div class="stat">Skor<b id="score">0</b></div><div class="stat">Kombo<b id="combo">0</b></div></div>
    <div id="board" aria-label="Papan mewarnai"></div>
    <div id="palette" aria-label="Palet warna"></div>
    <div id="message">Pilih warna, lalu ketuk bidang.</div>
    <button id="start" class="btn">MULAI MEWARNAI</button>
    <div class="hint">Benar +100 · Salah -50 · Semua selesai +500</div>
  </main>
</div>
<script>
const COLORS=['#e84c3d','#f2b632','#3c91c9','#43a66b','#9b67c6','#ef8b38'];
const TARGET=[0,2,4,1,3,5,2,0,3,4,1,5];
const board=document.getElementById('board'),palette=document.getElementById('palette'),start=document.getElementById('start');
let chosen=0,score=0,combo=0,time=60,running=false,timer=0,done=0;
function makeBoard(){board.innerHTML='';TARGET.forEach((target,i)=>{const b=document.createElement('button');b.className='cell';b.dataset.target=target;b.dataset.index=i;b.style.background='#dfe5df';b.style.setProperty('--target',COLORS[target]);b.innerHTML='<span class="target-dot" aria-hidden="true"></span>';b.setAttribute('aria-label','Bidang '+(i+1)+', cocokkan titik warna');b.onclick=()=>paint(b);board.appendChild(b)})}
function makePalette(){
  palette.innerHTML='';
  for(let i=0;i<COLORS.length;i++){
    const b=document.createElement('button');
    b.className='swatch'+(i===0?' selected':'');
    b.style.backgroundColor=COLORS[i];
    b.setAttribute('aria-label','Warna '+(i+1));
    b.type='button';
    b.onclick=()=>{chosen=i;document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};
    palette.appendChild(b);
  }
}
function paint(cell){if(!running||cell.classList.contains('done'))return;if(Number(cell.dataset.target)===chosen){cell.style.background=COLORS[chosen];cell.classList.add('done');score+=100+combo*10;combo++;done++;msg('Bagus! +'+(100+(combo-1)*10));if(done===TARGET.length){score+=500;finish('Semua bidang selesai! Bonus +500')}}else{score=Math.max(0,score-50);combo=0;cell.classList.remove('wrong');void cell.offsetWidth;cell.classList.add('wrong');msg('Warna belum cocok — coba lagi')}} 
function msg(t){document.getElementById('message').textContent=t;document.getElementById('score').textContent=score;document.getElementById('combo').textContent=combo}
function finish(t){running=false;clearInterval(timer);start.textContent='MAIN LAGI';msg(t+' Skor '+score);try{const best=Math.max(score,Number(localStorage.getItem('reichas_warna_best')||0));localStorage.setItem('reichas_warna_best',best)}catch(e){}}
function begin(){makeBoard();score=0;combo=0;done=0;time=60;running=true;start.classList.add('hidden');document.getElementById('time').textContent=time;msg('Pilih warna, lalu ketuk bidang.');timer=setInterval(()=>{time--;document.getElementById('time').textContent=time;if(time<=0)finish('Waktu habis.');},1000)}
start.onclick=()=>{start.classList.add('hidden');begin()};makeBoard();makePalette();
</script>
</body>
</html>
